  <script>
    // Тема ставится до отрисовки, чтобы не мигало
    (function () {
      var t = null;
      try { t = localStorage.getItem('pg_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark' && t !== 'oled') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
