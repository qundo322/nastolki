[data-theme='oled'] {
  --cn-red: #8a2c24;
  --cn-red-text: #ffc2b9;
  --cn-red-glow: rgba(138, 44, 36, 0.45);
  --cn-blue: #164a70;
  --cn-blue-text: #b9dcff;
  --cn-blue-glow: rgba(22, 74, 112, 0.45);
  --cn-neu: #2c2b29;
  --cn-neu-text: #a9a59e;
  --cn-ass: #050505;
  --cn-ass-text: #8b8b90;
  --cn-text: #cfced6;
  --cn-card: #0e0e11;
}
[data-theme='oled'] .cn-card.c-assassin { box-shadow: inset 0 0 0 1px #3a3a42; }
[data-theme='oled'] .turn-glow { opacity: 0.35; }

/* Конфетти победителей */
#confetti { position: fixed; inset: 0; z-index: 150; pointer-events: none; }

/* Радио — кнопка слева снизу, плеер над ней */
#radio-fab { position: fixed; left: 16px; bottom: 16px; z-index: 71; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 8px; border-radius: 99px;
  background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); box-shadow: 0 8px 24px rgba(0,0,0,.3); cursor: pointer; font: inherit; transition: border-color .15s, transform .12s; }
#radio-fab[hidden] { display: none; }
#radio-fab:hover { border-color: var(--accent-line); transform: translateY(-1px); }
#radio-fab.on { border-color: var(--accent); }
.rf-ic { position: relative; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; }
.rf-t { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.rf-t b { font-size: 14px; }
.rf-sub { font-size: 11px; color: var(--muted); font-weight: 700; }
.eq { position: absolute; right: -4px; bottom: -3px; display: none; gap: 1.5px; align-items: flex-end; height: 12px; padding: 2px 3px; border-radius: 6px; background: var(--surface); }
.eq b { width: 2.5px; background: var(--accent-text); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
.eq b:nth-child(2) { animation-delay: -0.3s; }
.eq b:nth-child(3) { animation-delay: -0.6s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 9px; } }
#radio-fab.playing .eq { display: inline-flex; }
#lofi { bottom: 80px; }
/* «Свернуть» = убрать плеер с экрана, музыка продолжает играть */
#lofi.mini { position: fixed; left: -10000px; bottom: 0; width: 320px; }
@media (max-width: 640px) {
  #radio-fab { left: 10px; bottom: 10px; height: 46px; padding: 0 12px 0 6px; }
  .rf-ic { width: 32px; height: 32px; }
  #lofi { bottom: 66px; }
}

/* Кто я — вопрос крупно, история карточками */
.qa-asker { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.qa-asker b { color: var(--text); }
.qa-big { font-family: var(--display); font-size: clamp(24px, 3.4vw, 40px); line-height: 1.2; text-align: center; padding: 14px 8px 18px; word-break: break-word; }
.qa-big .muted { font-family: inherit; font-size: 18px; }
.qa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 8px 0 4px; }
.qa-c { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 104px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); border-top: 4px solid var(--line-strong); }
.qa-c.v-yes { border-top-color: var(--green); }
.qa-c.v-no { border-top-color: var(--red); }
.qa-c.v-live { border-top-color: var(--accent); border-style: dashed; border-top-style: solid; }
.qa-c-q { font-weight: 800; font-size: 16px; line-height: 1.3; }
.qa-c-q i { color: var(--muted); font-weight: 600; }
.qa-c-a { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.qa-c-v { font-family: var(--display); font-size: 15px; }
.qa-c.v-yes .qa-c-v { color: var(--green-text); }
.qa-c.v-no .qa-c-v { color: var(--red-text); }
.qa-c.v-live .qa-c-v { color: var(--accent-text); font-family: inherit; font-size: 13px; font-weight: 700; }
.qa-c-n { display: inline-flex; gap: 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
.qa-c-n i { font-style: normal; }
.qa-c-n .y { color: var(--green-text); }
.qa-c-n .n { color: var(--red-text); }
.qa-c.qa-ask { border: 2px dashed var(--accent-line); border-top: 4px solid var(--accent); background: var(--accent-soft); }
.qa-ask .inp { width: 100%; font-weight: 700; }
.qa-ask .btn { width: 100%; justify-content: center; }
.qa-hist .qa-grid { margin-top: 10px; }

/* Элиас — проверка слов карточками, кнопка всегда на виду */
.review { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 12px 0 0; flex-direction: initial; }
.review .rw { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; min-height: 92px; padding: 12px; border-radius: 14px; text-align: left; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; transition: transform .1s, border-color .15s, background .15s; }
.review .rw:hover { transform: translateY(-1px); }
.review .rw.ok { border-color: color-mix(in srgb, var(--green) 60%, transparent); background: color-mix(in srgb, var(--green) 12%, var(--surface-2)); }
.review .rw.no { border-color: color-mix(in srgb, var(--red) 50%, transparent); background: color-mix(in srgb, var(--red) 9%, var(--surface-2)); }
.review .rw.other { border-color: var(--accent-line); background: var(--accent-soft); }
.review .rw.last { border-style: dashed; }
.rw-ic { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); }
.rw.ok .rw-ic { color: var(--green-text); }
.rw.no .rw-ic { color: var(--red-text); }
.rw.other .rw-ic { color: var(--accent-text); }
.rw-w { font-weight: 800; font-size: 18px; line-height: 1.2; }
.review .rw em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); }
.rw.ok em { color: var(--green-text); }
.rw.no em { color: var(--red-text); }
.rv-sum { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.rv-sum span { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); }
.rv-sum .ok { color: var(--green-text); }
.rv-sum .no { color: var(--red-text); }
.rv-sum b { margin-left: auto; font-family: var(--display); font-size: 18px; }
.rv-cta { position: sticky; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 14px 0 6px; margin-top: 8px;
  background: linear-gradient(to bottom, transparent, var(--surface) 35%); }
.rl-pt.t b { color: var(--accent-text); }
.rl-pt.t.neg b { color: var(--red-text); }
.who { padding-bottom: 130px; }

/* Меню «Вид» */
.view-pop { min-width: 250px; }
.vp-h { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 4px; }
.vp-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.vp-toggle { width: 100%; }
.sw-t { margin-left: auto; flex: none; width: 34px; height: 20px; border-radius: 99px; background: var(--line-strong); position: relative; transition: background .15s; }
.sw-t::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw-t.on { background: var(--green); }
.sw-t.on::after { transform: translateX(14px); }
.vp-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px 6px 8px; }
.vp-seg button { height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font-weight: 800; cursor: pointer; font-family: var(--card-font); }
.vp-seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
[data-glow='off'] .turn-glow { display: none; }
/* Статус занимает всю зарезервированную высоту — без пустого зазора над полем */
.cn-status > :first-child { flex: 1 1 auto; }
.cn-status > .cn-clue, .cn-status > .ready-box, .cn-status > .clue-form, .cn-status > form { align-items: center; }
.cn-status > .cn-clue { display: flex; }

#radio-pause { position: fixed; bottom: 22px; z-index: 71; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.3); transition: transform .12s, border-color .15s; left: 152px; }
#radio-pause[hidden] { display: none; }
#radio-pause:hover { transform: translateY(-1px); border-color: var(--accent-line); }
#radio-pause.paused { color: var(--accent-text); border-color: var(--accent); }
@media (max-width: 640px) { #radio-pause { bottom: 13px; left: 136px; width: 38px; height: 38px; } }
h1, h2, h3, h4, .h2, .tp-name, .gname, .mega-word, .qa-big, .rl-hero h3, .nom-t, .sum-t { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; }


#demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.db-row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.db-l{font-size:12px;font-weight:800;color:var(--accent-text);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.db-p{border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.db-p.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.db-p.add,.db-p.exit{background:transparent;border-style:dashed}
.db-hint{font-size:12px;color:var(--muted);margin-top:5px;min-height:15px}
.db-row .db-hint{margin:0}
body{padding-bottom:84px}
.ctlbar{bottom:94px} .chat-dock{bottom:94px} #lofi{bottom:94px} body.has-ctl #lofi{bottom:170px} #toasts{bottom:calc(var(--ctl-h) + 110px)}
.stage{padding-bottom:calc(var(--ctl-h) + 180px)}

/* Пиксель-аватар 16×16. 8 параметров, у каждого 10 вариантов. Фон задаёт игра (цвет команды или случайный).
   PixelAvatar.svg(av, size, bg) → строка <svg>; PixelAvatar.random() → случайный набор. */
(() => {
  const KEYS = ['s', 'h', 'hc', 'e', 'm', 'b', 'a', 'w'];
  const LABEL = { s: 'Кожа', h: 'Причёска', hc: 'Цвет волос', e: 'Цвет глаз', m: 'Рот', b: 'Борода', a: 'Аксессуар', w: 'Головной убор' };
  const COLOR_KEYS = ['s', 'hc', 'e'];
  const NAMES = {
    h: ['Лысый', 'Ёжик', 'Классика', 'Ирокез', 'Шипы', 'Каре', 'Длинные', 'Афро', 'Пучок', 'Хвост'],
    m: ['Улыбка', 'Ровно', 'Хохот', 'Ого', 'Ухмылка', 'Язык', 'Грусть', 'Зубы', 'Котик', 'Хм'],
    b: ['Нет', 'Щетина', 'Усы', 'Борода', 'Эспаньолка', 'Шкипер', 'Усы-руль', 'Длинная', 'Под губой', 'Бакенбарды'],
    a: ['Нет', 'Очки', 'Тёмные очки', 'Повязка', 'Монокль', 'Румянец', 'Серьги', 'Веснушки', 'Шрам', 'Визор'],
    w: ['Нет', 'Кепка', 'Шапка', 'Ковбойская', 'Корона', 'Повязка', 'Бандана', 'Цилиндр', 'Викинг', 'Наушники'],
  };
  const PAL = {
    s: ['#ffe0c7', '#f6c9a3', '#ecb489', '#dc9b6d', '#c98452', '#ae6a3f', '#8d522f', '#6e3d23', '#f3c6c6', '#a8d8a0'],
    hc: ['#1d1816', '#3d2a1f', '#6a4426', '#9c6431', '#d6a24a', '#f0d68b', '#c2412e', '#8a8f99', '#ecebf0', '#5c7cfa'],
    e: ['#1f1f24', '#5b3a1e', '#2f6fd6', '#2e9b65', '#7d8b97', '#8d5bd6', '#c8871f', '#d33f6a', '#1fb5c9', '#9aa6b2'],
  };
  // Фоны для одиночных игр (выбираются по игроку) и для команд
  const BG = ['#ffd166', '#ff8c69', '#ff70a6', '#b388ff', '#6aa9ff', '#4fd1c5', '#7ed957', '#d4e157', '#f4a261', '#9aa5b8'];
  const NEUTRAL = '#8b93a7';

  // осветлить (f>0) или затемнить (f<0) цвет
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = f < 0 ? 0 : 255, p = Math.abs(f);
    r = Math.round((t - r) * p + r);
    g = Math.round((t - g) * p + g);
    b = Math.round((t - b) * p + b);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  // Причёски: [y, x1, x2]
  const HAIR = [
    [],
    [[3, 5, 10], [4, 4, 11]],
    [[2, 5, 10], [3, 4, 11], [4, 4, 11], [5, 4, 7], [5, 11, 11], [6, 4, 4], [6, 11, 11]],
    [[0, 7, 8], [1, 7, 8], [2, 7, 8], [3, 6, 9], [4, 6, 9]],
    [[1, 5, 5], [1, 8, 8], [1, 11, 11], [2, 5, 6], [2, 8, 9], [2, 10, 11], [3, 4, 11], [4, 4, 11], [5, 4, 4], [5, 11, 11]],
    [[2, 5, 10], [3, 4, 11], [4, 3, 12], [5, 3, 12], ...[6, 7, 8, 9, 10].flatMap((y) => [[y, 3, 4], [y, 11, 12]])],
    [[2, 5, 10], [3, 4, 11], [4, 3, 12], [5, 3, 5], [5, 10, 12], ...[6, 7, 8, 9, 10, 11, 12].flatMap((y) => [[y, 3, 4], [y, 11, 12]]), [13, 2, 4], [13, 11, 13], [14, 2, 4], [14, 11, 13]],
    [[0, 5, 10], [1, 3, 12], [2, 2, 13], [3, 2, 13], [4, 2, 13], [5, 2, 4], [5, 11, 13], [6, 2, 3], [6, 12, 13], [7, 2, 3], [7, 12, 13], [8, 3, 3], [8, 12, 12]],
    [[0, 6, 9], [1, 6, 9], [2, 5, 10], [3, 4, 11], [4, 4, 11], [5, 4, 4], [5, 11, 11]],
    [[2, 5, 10], [3, 4, 11], [4, 4, 11], [5, 4, 5], [5, 10, 11], [4, 12, 13], [5, 12, 13], [6, 13, 14], [7, 13, 14], [8, 13, 14], [9, 13, 13]],
  ];
  const BEARD = [
    [],
    'stubble',
    [[9, 6, 9]],
    [[8, 4, 4], [8, 11, 11], [9, 4, 11], [10, 4, 5], [10, 10, 11], [11, 4, 5], [11, 10, 11], [12, 4, 11], [13, 5, 10]],
    [[12, 6, 9], [13, 7, 8]],
    [[9, 4, 4], [9, 11, 11], [10, 4, 4], [10, 11, 11], [11, 4, 4], [11, 11, 11], [12, 4, 11], [13, 6, 9]],
    [[9, 5, 10], [10, 4, 4], [10, 11, 11]],
    [[8, 4, 4], [8, 11, 11], [9, 4, 11], [10, 4, 5], [10, 10, 11], [11, 4, 5], [11, 10, 11], [12, 4, 11], [13, 5, 10], [14, 6, 9], [15, 7, 8]],
    [[12, 7, 8]],
    [6, 7, 8, 9].flatMap((y) => [[y, 4, 4], [y, 11, 11]]),
  ];

  function draw(av, bg) {
    const R = [];
    const px = (x, y, c, o) => R.push([x, y, 1, 1, c, o]);
    const span = (y, x1, x2, c, o) => R.push([x1, y, x2 - x1 + 1, 1, c, o]);
    const spans = (list, c, o) => list.forEach(([y, a, b]) => span(y, a, b, c, o));
    const skin = PAL.s[av.s], hair = PAL.hc[av.hc], eye = PAL.e[av.e];
    const skinD = shade(skin, -0.18);
    const dark = '#3b2028';

    R.push([0, 0, 16, 16, bg]);
    // плечи и шея
    const shirt = shade(bg, -0.38);
    span(14, 3, 12, shirt);
    span(15, 2, 13, shirt);
    span(13, 6, 9, skinD);
    // голова и уши
    span(4, 5, 10, skin);
    for (let y = 5; y <= 11; y++) span(y, 4, 11, skin);
    span(12, 5, 10, skin);
    px(3, 8, skin); px(3, 9, skinD); px(12, 8, skin); px(12, 9, skinD);
    // нос
    px(7, 9, skinD); px(8, 9, skinD);
    // борода (до рта, чтобы рот был виден)
    const bd = BEARD[av.b];
    if (bd === 'stubble') spans([[10, 4, 5], [10, 10, 11], [11, 4, 11], [12, 5, 10]], hair, 0.35);
    else spans(bd, hair);
    // рот
    const M = [
      () => { px(6, 10, dark); px(9, 10, dark); span(11, 7, 8, dark); },
      () => span(11, 6, 9, dark),
      () => { span(10, 6, 9, dark); px(7, 10, '#fff'); px(8, 10, '#fff'); span(11, 7, 8, dark); },
      () => { span(10, 7, 8, dark); span(11, 7, 8, dark); },
      () => { px(9, 10, dark); span(11, 6, 8, dark); },
      () => { span(10, 6, 9, dark); span(11, 7, 8, '#e8768a'); },
      () => { span(10, 7, 8, dark); px(6, 11, dark); px(9, 11, dark); },
      () => { span(10, 6, 9, '#fff'); span(11, 6, 9, dark); },
      () => { px(6, 10, dark); px(7, 11, dark); px(8, 10, dark); px(9, 11, dark); },
      () => px(8, 11, dark),
    ];
    M[av.m]();
    // волосы, брови, глаза
    spans(HAIR[av.h], hair);
    const brow = av.h === 0 && av.b === 0 ? skinD : shade(hair, -0.1);
    span(6, 5, 6, brow); span(6, 9, 10, brow);
    px(6, 7, eye); px(6, 8, eye); px(9, 7, eye); px(9, 8, eye);
    px(5, 8, '#ffffff', 0.85); px(10, 8, '#ffffff', 0.85);
    // аксессуар
    const ink = '#1a1a1f', gold = '#e8b830';
    const frame = (x, c) => { span(6, x, x + 2, c); span(9, x, x + 2, c); px(x, 7, c); px(x, 8, c); px(x + 2, 7, c); px(x + 2, 8, c); };
    const A = [
      () => {},
      () => { frame(5, ink); frame(8, ink); px(4, 7, ink); px(11, 7, ink); },
      () => { span(7, 4, 11, ink); span(8, 5, 7, ink); span(8, 8, 10, ink); px(5, 7, '#6b7280'); px(8, 7, '#6b7280'); },
      () => { span(6, 4, 11, ink); span(7, 8, 10, ink); span(8, 8, 10, ink); px(9, 9, ink); },
      () => { frame(8, gold); px(10, 10, gold); px(11, 11, gold); px(11, 12, gold); },
      () => { span(9, 4, 5, '#f28b9b', 0.8); span(9, 10, 11, '#f28b9b', 0.8); },
      () => { px(3, 10, gold); px(12, 10, gold); },
      () => { const f = shade(skin, -0.42); px(5, 9, f); px(10, 9, f); px(4, 10, f); px(11, 10, f); px(6, 9, f, 0.7); },
      () => { const c = '#9b2f3a'; px(10, 9, c); px(10, 10, c); px(11, 10, c); px(9, 9, c, 0.6); },
      () => { span(7, 4, 11, '#38e1f2', 0.9); span(8, 4, 11, '#1aa7c4', 0.9); },
    ];
    A[av.a]();
    // головной убор
    const W = [
      () => {},
      () => { const c = '#d64545'; span(1, 5, 10, c); span(2, 4, 11, c); span(3, 4, 11, c); span(4, 4, 14, shade(c, -0.3)); px(7, 1, shade(c, 0.3)); },
      () => { const c = '#2bb3a3'; px(7, 0, '#fff'); px(8, 0, '#fff'); span(1, 5, 10, c); span(2, 4, 11, c); span(3, 4, 11, c); span(4, 4, 11, shade(c, 0.35)); },
      () => { const c = '#8a5a2b'; span(0, 6, 9, c); span(1, 5, 10, c); span(2, 5, 10, shade(c, -0.45)); span(3, 1, 14, shade(c, -0.15)); },
      () => { const c = gold; px(5, 1, c); px(7, 1, c); px(8, 1, c); px(10, 1, c); span(2, 5, 10, c); span(3, 5, 10, c); px(7, 3, '#d33f6a'); px(8, 3, '#d33f6a'); px(5, 3, '#2f6fd6'); px(10, 3, '#2f6fd6'); },
      () => { const c = '#e04848'; span(5, 4, 11, c); px(12, 5, c); px(13, 6, c); },
      () => { const c = '#5b3fa6'; span(2, 5, 10, c); span(3, 4, 11, c); span(4, 4, 11, c); span(4, 12, 13, c); px(13, 5, c); px(6, 3, '#fff'); px(9, 3, '#fff'); },
      () => { const c = '#1d1b22'; for (let y = 0; y <= 3; y++) span(y, 5, 10, c); span(3, 5, 10, '#c0392b'); span(4, 3, 12, c); },
      () => { const c = '#9aa1ab', h = '#f1e6c8'; span(2, 5, 10, c); span(3, 4, 11, c); span(4, 4, 11, shade(c, -0.25)); px(2, 1, h); span(2, 2, 3, h); px(3, 3, h); px(13, 1, h); span(2, 12, 13, h); px(12, 3, h); },
      () => { const c = '#2a2933', k = '#ff70a6'; span(1, 5, 10, c); px(4, 2, c); px(11, 2, c); px(3, 3, c); px(12, 3, c); for (let y = 4; y <= 5; y++) { px(3, y, c); px(12, y, c); } for (let y = 6; y <= 10; y++) { span(y, 2, 3, k); span(y, 12, 13, k); } },
    ];
    W[av.w]();
    return R;
  }

  const cache = new Map();
  function svg(av, size = 32, bg = NEUTRAL) {
    if (!av) return '';
    const key = KEYS.map((k) => av[k]).join('') + ':' + size + bg;
    if (cache.has(key)) return cache.get(key);
    const rects = draw(av, bg)
      .map(([x, y, w, h, c, o]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"${o != null ? ` fill-opacity="${o}"` : ''}/>`)
      .join('');
    const out = `<svg class="px" viewBox="0 0 16 16" width="${size}" height="${size}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
    if (cache.size > 600) cache.clear();
    cache.set(key, out);
    return out;
  }
  const random = () => Object.fromEntries(KEYS.map((k) => [k, Math.floor(Math.random() * 10)]));
  const valid = (a) => a && KEYS.every((k) => Number.isInteger(a[k]) && a[k] >= 0 && a[k] <= 9);

  // Базовый вид для превью вариантов в конструкторе: меняется только сам вариант
  const BASE = { s: 1, h: 2, hc: 1, e: 2, m: 0, b: 0, a: 0, w: 0 };
  window.PixelAvatar = { KEYS, LABEL, NAMES, PAL, BG, NEUTRAL, BASE, COLOR_KEYS, svg, random, valid };
})();

/* Звуки интерфейса: синтез через WebAudio, без файлов. Sound.play('click'), Sound.vol / Sound.setVol(0..100). */
(() => {
  let ctx = null;
  let master = null;
  let vol = 60;
  try {
    const v = localStorage.getItem('pg_sfx');
    if (v !== null) vol = Math.max(0, Math.min(100, Number(v)));
  } catch {}

  function ac() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = (vol / 100) ** 1.6 * 0.9;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // браузер разрешает звук только после первого действия пользователя
  ['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, () => ac(), { once: true, capture: true }));

  // нота: частота, длительность, тип волны, громкость, задержка, скольжение к частоте
  function tone(f, dur, { type = 'sine', gain = 0.25, delay = 0, to = null, attack = 0.005 } = {}) {
    const c = ac();
    if (!c || !vol) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function noise(dur, { gain = 0.15, delay = 0, from = 800, to = 3000, q = 1.2 } = {}) {
    const c = ac();
    if (!c || !vol) return;
    const t = c.currentTime + delay;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = q;
    bp.frequency.setValueAtTime(from, t);
    bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g).connect(master);
    src.start(t);
  }

  const N = { C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.5, G4: 392, E4: 329.63, C4: 261.63 };
  const SFX = {
    click: () => tone(1400, 0.035, { type: 'sine', gain: 0.08 }),
    tap: () => tone(700, 0.05, { type: 'triangle', gain: 0.12 }),
    vote: () => {
      tone(N.E5, 0.08, { type: 'triangle', gain: 0.14 });
      tone(N.A5, 0.1, { type: 'triangle', gain: 0.12, delay: 0.05 });
    },
    good: () => {
      tone(N.C5, 0.14, { gain: 0.2 });
      tone(N.E5, 0.14, { gain: 0.2, delay: 0.08 });
      tone(N.G5, 0.22, { gain: 0.2, delay: 0.16 });
    },
    bad: () => {
      tone(330, 0.18, { type: 'triangle', gain: 0.18, to: 220 });
      tone(247, 0.26, { type: 'triangle', gain: 0.14, delay: 0.12, to: 165 });
    },
    boom: () => {
      tone(140, 0.6, { type: 'sawtooth', gain: 0.18, to: 40 });
      noise(0.5, { gain: 0.25, from: 400, to: 80, q: 0.7 });
    },
    turn: () => noise(0.32, { gain: 0.12, from: 500, to: 4000 }),
    myturn: () => {
      noise(0.25, { gain: 0.08, from: 600, to: 3500 });
      tone(N.G5, 0.12, { gain: 0.15, delay: 0.12 });
      tone(N.C6, 0.2, { gain: 0.15, delay: 0.22 });
    },
    win: () => [N.C5, N.E5, N.G5, N.C6, N.E6].forEach((f, i) => tone(f, 0.22, { type: 'triangle', gain: 0.18, delay: i * 0.09 })),
    lose: () => [N.G4, N.E4, N.C4].forEach((f, i) => tone(f, 0.3, { type: 'triangle', gain: 0.16, delay: i * 0.14 })),
    ready: () => {
      tone(N.E5, 0.1, { gain: 0.16 });
      tone(N.A5, 0.16, { gain: 0.16, delay: 0.07 });
    },
    unready: () => tone(N.A5, 0.12, { gain: 0.12, to: N.E5 }),
    start: () => {
      noise(0.4, { gain: 0.1, from: 300, to: 5000 });
      [N.C5, N.G5, N.C6].forEach((f, i) => tone(f, 0.18, { gain: 0.15, delay: 0.1 + i * 0.07 }));
    },
    pop: () => tone(900, 0.07, { type: 'sine', gain: 0.14, to: 1400 }),
    error: () => {
      tone(200, 0.09, { type: 'square', gain: 0.06 });
      tone(160, 0.12, { type: 'square', gain: 0.06, delay: 0.1 });
    },
    tick: () => tone(1800, 0.03, { type: 'sine', gain: 0.1 }),
    strike: () => noise(0.12, { gain: 0.1, from: 3000, to: 1200, q: 2 }),
    open: () => tone(600, 0.08, { type: 'sine', gain: 0.08, to: 900 }),
  };

  window.Sound = {
    play(name) {
      try {
        SFX[name] && SFX[name]();
      } catch {}
    },
    get vol() {
      return vol;
    },
    setVol(v) {
      vol = Math.max(0, Math.min(100, Math.round(v)));
      try {
        localStorage.setItem('pg_sfx', String(vol));
      } catch {}
      if (master) master.gain.value = (vol / 100) ** 1.6 * 0.9;
    },
  };

/* Клиент сборника настолок. Чистый JS, без сборки. Зависит от js/icons.js и js/avatar.js. */
(() => {
  const $app = document.getElementById('app');
  const LS = {
    get: (k, d) => {
      try {
        const v = localStorage.getItem(k);
        return v === null ? d : v;
      } catch {
        return d;
      }
    },
    set: (k, v) => {
      try {
        localStorage.setItem(k, v);
      } catch {}
    },
  };
  let token = LS.get('pg_token', '');
  if (!token) {
    token = Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2);
    LS.set('pg_token', token);
  }
  const loadAvatar = () => {
    try {
      const a = JSON.parse(LS.get('pg_avatar', 'null'));
      return PixelAvatar.valid(a) ? a : null;
    } catch {
      return null;
    }
  };

  const socket = io({ transports: ['websocket', 'polling'] });
  let S = null; // последнее состояние от сервера
  let GAMES = [];
  let PROFILES = [];
  let offset = 0; // serverNow - clientNow
  let connected = false;
  const ui = {
    homeStep: 'who', // who | avatar
    homeSel: LS.get('pg_profile', '') || (LS.get('pg_name', '') ? 'new' : null),
    avatar: loadAvatar() || PixelAvatar.random(),
    avEdit: null, // черновик аватара в модалке (в комнате)
    selected: null,
    settings: {},
    showRules: false,
    chatOpen: false,
    chatSeen: 0,
    menu: null, // открытое всплывающее меню: 'theme' | 'p:<pid>'
    hideCard: false,
    cnSlots: null, // [{id, v}] — силы слов в подсказке капитана

    mode: 'single',
    mOrder: ['codenames', 'justone', 'whoami', 'spyfall', 'alias'],
    mOn: { codenames: true, justone: true, whoami: true, spyfall: true },
    mRounds: { codenames: 2, justone: 1, whoami: 1, spyfall: 3, alias: 1 },
    mOpen: {},
    showTable: false,
  };

  // ---------- тема: тёмная / светлая / чёрная (OLED) ----------

    { id: 'oled', name: 'Чёрная (OLED)', icon: 'oled' },
  ];
  const theme = () => document.documentElement.getAttribute('data-theme') || 'dark';
  if (!THEMES.some((t) => t.id === document.documentElement.getAttribute('data-theme'))) {
    const saved = LS.get('pg_theme', '');
    document.documentElement.setAttribute(
      'data-theme',
      THEMES.some((t) => t.id === saved) ? saved : window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    );
  }
  const themeIcon = () => THEMES.find((t) => t.id === theme())?.icon || 'moon';
  // Настройки вида: свечение хода и размер слов на карточках Коднеймс (у каждого свои)
  const VIEW = {
    glow: LS.get('pg_glow', '1') !== '0',
    fs: Number(LS.get('pg_cnfs', '36')) || 36,
  };
  const FS_OPTS = [24, 30, 36, 42];
  function applyView() {
    document.documentElement.dataset.glow = VIEW.glow ? 'on' : 'off';
    document.documentElement.style.setProperty('--cn-fs', String(VIEW.fs));
  }
  applyView();
  const themeMenu = () => `<div class="menu-wrap" data-pop>
      <button class="btn sm ghost icon-btn" data-act="menu" data-menu="theme" title="Вид: тема, свечение, размер слов">${ic(themeIcon())}</button>
      ${
        ui.menu === 'theme'
          ? `<div class="pop right view-pop ${ui.popAnim ? 'anim' : ''}">
              <div class="vp-h">Тема</div>
              ${THEMES.map((t) => `<button class="pop-i ${theme() === t.id ? 'on' : ''}" data-act="set-theme" data-t="${t.id}">${ic(t.icon, 16)}<span>${t.name}</span>${theme() === t.id ? ic('check', 16, 'tick') : ''}</button>`).join('')}

              <div class="vp-h">Размер слов на карточках</div>

      ${

            </div>`
          : ''
      }
    </div>`;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const player = (pid) => S?.room.players.find((p) => p.id === pid);
  const nm = (pid) => esc(player(pid)?.name || '—');
  const isHost = () => S && S.room.hostId === S.me;
  const tour = () => S?.room.tour || null;
  const now = () => Date.now() + offset;
  const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c);

  // ---------- аватарки ----------
  const initials = (n) =>
    String(n || '?')
      .replace(/[^\p{L}\s]/gu, ' ')
      .split(/\s+/)
      .filter(Boolean)
      .map((w) => w[0])
      .join('')
      .slice(0, 2)
      .toUpperCase() || '?';
  const hue = (n) => [...String(n)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 360;
  const SIZES = { xs: 18, sm: 24, md: 32, lg: 56, xl: 120 };

  const TEAM_BG = { red: '#ff6452', blue: '#4fb8ff' };
  const ALIAS_BG = ['#ff6452', '#4fb8ff', '#7ed957', '#b388ff', '#ffd166'];
  function bgFor(id) {

    if (id && g?.type === 'codenames') return TEAM_BG[g.team[id]] || PixelAvatar.NEUTRAL;
    if (id && g?.type === 'alias') {
      const i = g.teams.findIndex((t) => t.members.includes(id));
      if (i >= 0) return ALIAS_BG[i];
    }
    return PixelAvatar.BG[hue(id || 'x') % PixelAvatar.BG.length];
  }
  function avaHtml(p, size = 'sm', cls = '') {
    const px = SIZES[size] || size;
    if (p?.avatar && PixelAvatar.valid(p.avatar))
      return `<span class="ava px ${size} ${cls}" style="width:${px}px;height:${px}px">${PixelAvatar.svg(p.avatar, px, p.bg || bgFor(p.id))}</span>`;
    const name = p?.name || '?';
    return `<span class="ava ${size} ${cls}" style="--h:${hue(name)};width:${px}px;height:${px}px"><b>${esc(initials(name))}</b></span>`;
  }
  const pa = (pid, size = 'sm', cls = '') => avaHtml(player(pid) || { name: '?' }, size, cls);
  const who = (pid, size = 'xs') => `<span class="who-n">${pa(pid, size)}<span>${nm(pid)}</span></span>`;

  function toast(msg, kind = 'err') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.classList.add('out'), 2600);
    setTimeout(() => el.remove(), 3000);
  }

  const emit = (ev, data = {}) =>
    new Promise((res) =>
      socket.emit(ev, data, (r) => {
        if (r && r.error) {
          toast(r.error);

        res(r || {});
      })
    );
  const act = (type, extra = {}) => emit('action', { type, ...extra });

  // ---------- общее радио комнаты (YouTube) ----------
  // Что играет — общее для всей комнаты (сервер). Слушать или нет и громкость — у каждого свои.
  const ytId = (url) => {
    const m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/) || String(url || '').match(/^([\w-]{11})$/);
    return m ? m[1] : null;
  };
  const music = {
    on: false,
    playing: false,
    open: false,
    vol: Number(LS.get('pg_lofi_vol', '40')),
    player: null,
    ready: false,
    curId: null,
    apiReady: null,
  };
  const radio = () => S?.room?.radio || null;
  function loadYT() {
    if (music.apiReady) return music.apiReady;
    music.apiReady = new Promise((res, rej) => {
      if (window.YT && window.YT.Player) return res();
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => {
        prev && prev();
        res();
      };
      const sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      sc.onerror = () => rej(new Error('yt'));
      document.head.appendChild(sc);
      setTimeout(() => rej(new Error('timeout')), 12000);
    });
    return music.apiReady;
  }
  const dock = document.createElement('div');
  dock.id = 'lofi';
  dock.hidden = true;
  dock.innerHTML = `<div class="lofi-head"><b class="lofi-title" data-lofi="expand" title="Показать плеер">${ic('headphones', 16)} Радио комнаты</b><span class="lofi-state muted small"></span><button class="icon-x" data-lofi="close" title="Выключить у себя">${ic('x', 16)}</button></div>
    <div class="lofi-video"><div id="lofi-player"></div></div>
    <div class="lofi-now"></div>
    <div class="lofi-ctl">
      <button class="btn sm icon-btn" data-lofi="toggle" title="Пауза / играть (только у вас)">${ic('pause', 16)}</button>
      <input type="range" min="0" max="100" step="1" data-lofi="vol" aria-label="Громкость"/>
      <span class="lofi-host"></span>
      <button class="btn sm ghost icon-btn" data-lofi="min" title="Свернуть">${ic('chevron', 16)}</button>
    </div>
    <div class="lofi-queue"></div>
    <form class="lofi-add" data-lofi-form><input class="inp" name="url" placeholder="Ссылка на YouTube" autocomplete="off"/><button class="btn sm primary" title="Добавить в очередь">${ic('plus', 16)} В очередь</button></form>`;
  document.body.appendChild(dock);
  dock.querySelector('[data-lofi="vol"]').value = music.vol;
  // Кнопка радио — слева снизу, открывает мини-плеер над собой
  const fab = document.createElement('button');
  fab.id = 'radio-fab';
  fab.hidden = true;
  fab.title = 'Радио комнаты — у всех играет одно и то же';
  fab.innerHTML = `<span class="rf-ic">${ic('headphones', 20)}<i class="eq"><b></b><b></b><b></b></i></span><span class="rf-t"><b>Радио</b><span class="rf-sub">включить</span></span>`;
  document.body.appendChild(fab);
  // Маленькая пауза рядом с кнопкой радио — видна, когда радио включено
  const pauseBtn = document.createElement('button');
  pauseBtn.id = 'radio-pause';
  pauseBtn.hidden = true;
  document.body.appendChild(pauseBtn);
  pauseBtn.addEventListener('click', () => {
    if (!music.player || !music.ready) return;
    music.playing ? music.player.pauseVideo() : music.player.playVideo();
  });
  fab.addEventListener('click', () => {
    Sound.play('click');
    if (!music.on) return startMusic();
    music.open = !music.open;
    syncMusicUI();
  });
  const rEmit = (op, x = {}) => emit('radio', { op, ...x });

  function syncMusicUI() {
    const r = radio();
    dock.hidden = !music.on || !r;
    dock.classList.toggle('mini', !music.open);
    dock.querySelector('[data-lofi="toggle"]').innerHTML = ic(music.playing ? 'pause' : 'play', 16);
    dock.querySelector('.lofi-state').textContent = music.playing ? 'играет' : 'на паузе';
    fab.hidden = !r;
    pauseBtn.hidden = !r || !music.on;
    pauseBtn.innerHTML = ic(music.playing ? 'pause' : 'play', 16);
    pauseBtn.title = music.playing ? 'Пауза (только у вас)' : 'Продолжить';
    pauseBtn.classList.toggle('paused', !music.playing);
    fab.classList.toggle('on', music.on);
    fab.classList.toggle('playing', music.on && music.playing);
    fab.classList.toggle('open', music.on && music.open);
    fab.querySelector('.rf-sub').textContent = !music.on ? 'включить' : music.playing ? (r?.cur?.live ? 'эфир' : 'играет') : 'пауза';
    if (!r) return;
    const host = isHost();
    const c = r.cur;
    dock.querySelector('.lofi-now').innerHTML = `<span class="ln-k">${c.live ? 'Эфир' : 'Сейчас'}</span><span class="ln-t" title="${esc(c.title)}">${esc(c.title)}</span>${c.by ? `<span class="ln-by">${pa(c.by, 'xs', 'round')}${nm(c.by)}</span>` : ''}`;
    dock.querySelector('.lofi-host').innerHTML = host
      ? `<button class="btn sm ghost icon-btn" data-lofi="skip" title="Следующий трек (для всех)">${ic('skip', 16)}</button>${c.live ? '' : `<button class="btn sm ghost icon-btn" data-lofi="lofi" title="Вернуть лофи-эфир">${ic('music', 16)}</button>`}`
      : '';
    const q = r.queue;
    dock.querySelector('.lofi-queue').innerHTML = `<div class="lq-h">Очередь <span class="muted">${q.length || 'пусто'}</span></div>${q
      .map(
        (x, i) => `<div class="lq-i"><span class="lq-n">${i + 1}</span><span class="lq-t" title="${esc(x.title)}">${esc(x.title)}</span>${x.by ? `<span class="lq-by" title="Добавил ${nm(x.by)}">${pa(x.by, 'xs', 'round')}</span>` : ''}${
          host
            ? `<span class="lq-ctl"><button class="icon-x" data-lofi="up" data-q="${x.qid}" ${i === 0 ? 'disabled' : ''} title="Выше">${ic('up', 14)}</button><button class="icon-x" data-lofi="down" data-q="${x.qid}" ${i === q.length - 1 ? 'disabled' : ''} title="Ниже">${ic('down', 14)}</button><button class="icon-x" data-lofi="rm" data-q="${x.qid}" title="Убрать">${ic('x', 14)}</button></span>`
            : ''
        }</div>`
      )
      .join('')}${q.length ? '' : `<div class="muted small">${c.live ? 'Добавьте трек — он включится сразу, лофи уступит.' : 'После текущего трека вернётся лофи-эфир.'}</div>`}`;
  }

  // Подстроиться под то, что сейчас играет в комнате
  async function syncRadio() {
    const r = radio();
    if (!r) {
      if (music.on) stopMusic();
      return;
    }
    syncMusicUI();
    if (!music.on || r.cur.id === music.curId) return;
    music.curId = r.cur.id;
    const c = r.cur;
    const at = c.live ? 0 : Math.max(0, (now() - c.startedAt) / 1000);
    try {
      await loadYT();
      if (music.player && music.ready) {
        music.player.loadVideoById({ videoId: c.vid, startSeconds: at > 3 ? at : 0 });
        return;
      }
      if (music.player) return; // ещё создаётся — onReady подхватит текущий трек
      music.player = new YT.Player('lofi-player', {
        videoId: c.vid,
        width: '100%',
        height: '100%',
        playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, start: Math.floor(at > 3 ? at : 0) },
        events: {
          onReady: (e) => {
            music.ready = true;
            e.target.setVolume(music.vol / 2); // ползунок 0–100 = громкость 0–50: тише и точнее
            const rr = radio();
            if (rr && rr.cur.vid !== c.vid) {
              music.curId = null;
              return syncRadio();
            }
            e.target.playVideo();
          },
          onStateChange: (e) => {
            music.playing = e.data === 1 || e.data === 3;
            if (e.data === 0) rEmit('ended', { id: music.curId }); // трек доиграл — дальше по очереди у всех
            if (e.data === 1) {
              const rr = radio();
              const t = e.target.getVideoData?.().title;
              if (rr && t && rr.cur.id === music.curId && (!rr.cur.title || rr.cur.title === 'Трек')) rEmit('title', { id: music.curId, title: t });
            }
            syncMusicUI();
          },
          onError: () => {
            toast('Трек недоступен — переключаем дальше');
            rEmit('broken', { id: music.curId });
          },
        },
      });
    } catch {
      document.getElementById('lofi-player').outerHTML = `<iframe id="lofi-player" src="https://www.youtube.com/embed/${c.vid}?autoplay=1&playsinline=1&start=${Math.floor(at)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      music.playing = true;
      syncMusicUI();
    }
  }
  function startMusic() {
    music.on = true;
    music.open = true;
    music.curId = null;
    syncRadio();
  }
  function stopMusic() {
    try {
      music.player && music.ready && music.player.stopVideo();
    } catch {}
    const f = document.querySelector('iframe#lofi-player');
    if (f && !music.player) f.src = 'about:blank';
    music.on = false;
    music.playing = false;
    music.curId = null;
    syncMusicUI();
  }
  dock.addEventListener('click', (e) => {
    const b = e.target.closest('[data-lofi]');
    if (!b || b.disabled) return;
    const a = b.dataset.lofi;
    if (a === 'close') stopMusic();
    else if (a === 'expand') {
      music.open = true;
      syncMusicUI();
    } else if (a === 'min') {
      music.open = false;
      syncMusicUI();
    } else if (a === 'toggle') {
      if (!music.player || !music.ready) return;
      music.playing ? music.player.pauseVideo() : music.player.playVideo();
    } else if (a === 'skip') rEmit('skip');
    else if (a === 'lofi') rEmit('lofi');
    else if (a === 'rm') rEmit('remove', { qid: b.dataset.q });
    else if (a === 'up' || a === 'down') rEmit('move', { qid: b.dataset.q, d: a === 'up' ? -1 : 1 });
  });
  dock.addEventListener('submit', async (e) => {
    e.preventDefault();
    const inp = e.target.querySelector('input');
    const u = inp.value.trim();
    if (!u) return;
    if (!ytId(u)) return toast('Не похоже на ссылку YouTube');
    const r = await rEmit('add', { url: u });
    if (!r.error) {
      inp.value = '';
      toast('Добавлено в очередь', 'ok');
    }
  });
  dock.addEventListener('input', (e) => {
    if (e.target.dataset.lofi !== 'vol') return;
    music.vol = Number(e.target.value);
    LS.set('pg_lofi_vol', String(music.vol));
    try {
      music.player && music.ready && music.player.setVolume(music.vol / 2);
    } catch {}
  });

  // ---------- маршрутизация ----------
  function codeFromUrl() {
    const m = location.pathname.match(/^\/r\/([A-Za-z]{4})/) || location.hash.match(/^#([A-Za-z]{4})/);
    return m ? m[1].toUpperCase() : null;
  }
  const roomLink = (code) => `${location.origin}/r/${code}`;
  const identity = () => {
    const profile = LS.get('pg_profile', '') || null;
    return {
      profile,
      name: profile ? PROFILES.find((p) => p.id === profile)?.name || '' : LS.get('pg_name', ''),
      avatar: loadAvatar(),
    };
  };

  async function joinRoom(code) {
    const id = identity();
    if ((!id.profile && !id.name) || !id.avatar) return render();
    const r = await emit('joinRoom', { token, code, ...id });
    if (r.error) {
      history.replaceState(null, '', '/');
      render();
    }
  }

  socket.on('connect', () => {
    connected = true;
    const code = S?.room.code || codeFromUrl();
    if (code) joinRoom(code);
    else render();
  });
  socket.on('disconnect', () => {
    connected = false;
    render();
  });
  socket.on('kicked', () => {
    S = null;
    syncRadio();
    history.replaceState(null, '', '/');
    toast('Вы покинули комнату', 'info');
    render();
  });
  // Звуки и анимации по изменению состояния игры
  function detectEvents(prev, next) {
    if (!prev) return;
    const me = next.me;
    const pc = prev.room.chat, nc = next.room.chat;
    if (nc.length > pc.length && nc[nc.length - 1]?.pid !== me) Sound.play('pop');
    const a = prev.game, b = next.game;
    if (!b) return;
    if (!a || a.type !== b.type) return Sound.play('start');
    if (b.type === 'codenames') {
      const fresh = [];
      b.cards.forEach((c, i) => c.revealed && !a.cards[i]?.revealed && fresh.push(i));
      if (fresh.length) {
        ui.flip = new Map(fresh.map((i) => [i, Date.now()]));
        setTimeout(() => (ui.flip = null), 800);
        const col = b.cards[fresh[0]].color;
        Sound.play(col === 'assassin' ? 'boom' : col === a.turn ? 'good' : 'bad');
      }
      if (b.winner && !a.winner) setTimeout(() => Sound.play(b.team[me] === b.winner ? 'win' : 'lose'), fresh.length ? 450 : 0);
      else if (a.step === 'setup' && b.step === 'clue') Sound.play('start');
      else if (a.winner && !b.winner) Sound.play('start');
      else if (b.turn !== a.turn && !b.winner) setTimeout(() => Sound.play(b.team[me] === b.turn ? 'myturn' : 'turn'), fresh.length ? 380 : 0);
      else if (a.step === 'clue' && b.step === 'guess' && b.team[me] === b.turn) Sound.play('myturn');
      if (b.pending && (!a.pending || a.pending.i !== b.pending.i)) Sound.play('vote');
      const strikes = (x) => (x.clues || []).reduce((n, c) => n + c.slots.filter((y) => y.done).length, 0);
      if (strikes(b) !== strikes(a)) Sound.play('strike');
    } else if (b.type === 'alias') {
      if (b.guessedNow > a.guessedNow) Sound.play('good');
      else if (b.skippedNow > a.skippedNow) Sound.play('bad');
      if (a.phase !== b.phase && b.phase === 'running') Sound.play('start');
      if (a.phase !== b.phase && b.phase === 'over') Sound.play('win');
    } else if (b.type === 'justone') {
      if (a.phase !== 'result' && b.phase === 'result') Sound.play(b.correct ? 'win' : 'bad');
      else if (a.phase !== b.phase) Sound.play('turn');
    } else if (b.type === 'spyfall') {
      if (a.phase !== 'over' && b.phase === 'over') Sound.play(b.result?.winner === 'spy' ? (b.spies?.includes(me) ? 'win' : 'lose') : b.result?.winner === 'town' ? (b.spies?.includes(me) ? 'lose' : 'win') : 'turn');
      if (a.phase !== 'guessing' && b.phase === 'guessing') Sound.play('myturn');
    } else if (b.type === 'whoami') {
      if (a.turnPid !== b.turnPid) Sound.play(b.turnPid === me ? 'myturn' : 'turn');
      if (b.finishOrder.length > a.finishOrder.length) Sound.play('good');
    }
  }

  socket.on('state', (st) => {
    offset = st.serverNow - Date.now();
    const prevKey = S?.game ? S.game.type + (S.game.round || '') : null;
    detectEvents(S, st);
    // Партия Коднеймс закончилась — показываем итоги
    if (S?.game?.type === 'codenames' && !S.game.winner && st.game?.type === 'codenames' && st.game.winner && st.game.summary) {
      ui.showSum = true;
      ui.sumAnim = true;
      confetti(st.game.winner);
    }
    if (st.game?.type !== 'codenames' || !st.game.winner) ui.showSum = false;
    S = st;
    syncRadio();
    if (location.pathname !== `/r/${st.room.code}`) history.replaceState(null, '', `/r/${st.room.code}`);
    if (!S.game && !ui.selected) ui.selected = S.room.gameType;
    if (S.room.gameType !== ui.selected && !isHost()) ui.selected = S.room.gameType;
    const key = S.game ? S.game.type + (S.game.round || '') : null;
    if (prevKey !== key) ui.hideCard = false;
    const g = S.game;
    if (g?.type !== 'codenames' || g.step !== 'clue') ui.cnSlots = ui.cnEdit ? ui.cnSlots : null;
    if (ui.cnEdit && (!g || g.type !== 'codenames' || !g.clue || g.clue.by !== S.me || now() > g.clue.editUntil)) {
      ui.cnEdit = false;
      ui.cnSlots = null;
    }
    render();
  });

  // Нельзя случайно закрыть вкладку посреди игры
  window.addEventListener('beforeunload', (e) => {
    if (S && S.game) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  Promise.all([fetch('/api/games').then((r) => r.json()), fetch('/api/profiles').then((r) => r.json())]).then(([g, p]) => {
    GAMES = g;
    PROFILES = p;
    render();
  });
  const gameMeta = (id) => GAMES.find((g) => g.id === id) || { title: id, settings: [], rules: [] };
  const gIcon = (id, size = 18) => ic(GAME_ICON[id] || 'dice', size);

  // ---------- сохранение ввода при перерисовке ----------
  function snapshotInputs() {
    const snap = {};
    $app.querySelectorAll('[data-keep]').forEach((el) => (snap[el.dataset.keep] = el.value));
    const a = document.activeElement;
    const focus = a && a.dataset && a.dataset.keep ? { k: a.dataset.keep, s: a.selectionStart, e: a.selectionEnd } : null;
    return { snap, focus };
  }
  function restoreInputs({ snap, focus }) {
    $app.querySelectorAll('[data-keep]').forEach((el) => {
      if (snap[el.dataset.keep] !== undefined && el.type !== 'checkbox') el.value = snap[el.dataset.keep];
    });
    if (focus) {
      const el = $app.querySelector(`[data-keep="${focus.k}"]`);
      if (el) {
        el.focus();
        try {
          el.setSelectionRange(focus.s, focus.e);
        } catch {}
      }
    }
  }

  // ---------- общий рендер ----------
  function render() {
    const keep = snapshotInputs();
    const chatEl = $app.querySelector('.chat-log');
    const chatScroll = chatEl?.scrollTop;
    const nearBottom = !chatEl || chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 40;
    const sk = screenKey();
    ui.enter = sk !== ui.lastScreen;
    ui.lastScreen = sk;
    const rb = $app.querySelector('.rl-body');
    const rulesScroll = rb && rb.dataset.g === String(ui.showRules) ? rb.scrollTop : 0;
    $app.innerHTML = S ? renderRoom() : renderHome();
    ui.popAnim = false;
    ui.rulesAnim = false;
    ui.sumAnim = false;
    restoreInputs(keep);
    const rb2 = $app.querySelector('.rl-body');
    if (rb2) {
      rb2.scrollTop = rulesScroll;
      if (ui.rulesTabScroll) $app.querySelector('.rl-tabs .on')?.scrollIntoView({ block: 'nearest', inline: 'center' });
      ui.rulesTabScroll = false;
    }
    const c = $app.querySelector('.chat-log');
    if (c) c.scrollTop = nearBottom ? c.scrollHeight : chatScroll;
    fitBoard();
    tick();
  }

  // Ключ «экрана»: когда он меняется — плавно проявляем новую сцену
  function screenKey() {
    if (!S) return 'home:' + ui.homeStep;
    const g = S.game;
    if (!g) return 'lobby:' + ui.mode + (tour() ? ':' + tour().phase : '');
    return [g.type, g.phase, g.step === 'setup' ? 'setup' : g.winner ? 'over' : '', g.round, g.guesser, g.explainer].join(':');
  }

  // Поле Коднеймс: максимально широкое, но целиком помещается по высоте экрана
  const STATUS_H = 140; // = min-height .cn-status + отступ
  function fitBoard() {
    const board = $app.querySelector('.cn-board');
    if (!board) return;
    const center = board.parentElement;
    if (window.innerWidth <= 1000) {
      center.style.setProperty('--board-w', 'none');
      return;
    }
    // Считаем от верха колонки + фиксированная высота блока подсказки — размер поля не зависит
    // от того, что сейчас в блоке подсказки (форма капитана, ожидание или сама подсказка)
    const top = center.getBoundingClientRect().top + window.scrollY + STATUS_H;
    const demo = document.getElementById('demo-bar');
    const reserve = 24 + (demo ? demo.offsetHeight : 0);
    const availH = window.innerHeight - top - reserve;
    const gap = 10;
    const w = Math.max(460, (availH - 4 * gap) * 1.55 + 4 * gap);
    center.style.setProperty('--board-w', Math.round(w) + 'px');
  }
  let fitT;
  window.addEventListener('resize', () => {
    clearTimeout(fitT);
    fitT = setTimeout(fitBoard, 80);
  });

  // ---------- конструктор аватара ----------
  function avatarEditor(av, scope) {
    const rows = PixelAvatar.KEYS.map((k) => {
      const opts = Array.from({ length: 10 }, (_, v) => {
        const on = av[k] === v;
        if (PixelAvatar.COLOR_KEYS.includes(k))
          return `<button type="button" class="sw-opt ${on ? 'on' : ''}" style="--c:${PixelAvatar.PAL[k][v]}" data-act="av-set" data-scope="${scope}" data-k="${k}" data-v="${v}" title="${v + 1}"></button>`;
        const prev = { ...PixelAvatar.BASE, [k]: v };
        return `<button type="button" class="av-opt ${on ? 'on' : ''}" data-act="av-set" data-scope="${scope}" data-k="${k}" data-v="${v}" title="${esc(PixelAvatar.NAMES[k][v])}">${PixelAvatar.svg(prev, 40, '#3a3748')}</button>`;
      }).join('');
      return `<div class="av-row"><div class="av-lbl">${PixelAvatar.LABEL[k]}${PixelAvatar.NAMES[k] ? `<span class="muted">${esc(PixelAvatar.NAMES[k][av[k]])}</span>` : ''}</div><div class="av-opts">${opts}</div></div>`;
    }).join('');
    return `<div class="av-editor">
      <div class="av-preview">
        <div class="av-big">${PixelAvatar.svg(av, 160, PixelAvatar.NEUTRAL)}</div>
        <button type="button" class="btn sm" data-act="av-random" data-scope="${scope}">${ic('dice5', 16)} Случайно</button>
        <p class="muted small av-note">Фон подберётся сам: цвет команды в командных играх, свой цвет — в остальных.</p>
      </div>
      <div class="av-params">${rows}</div>
    </div>`;
  }

  // ---------- вход ----------
  function renderHome() {
    const code = codeFromUrl();
    const sel = ui.homeSel;
    const header = `<div class="home-top">${themeMenu()}</div>`;
    const hero = `<div class="home-hero">
        <div class="logo-mark">${ic('dice', 40)}</div>
        <h1>Экранки <span>а не настолки — для своих</span></h1>
        <p class="lead">Коднеймс, Элиас, Шпион, Кто я и Намёк понял — по одной или марафоном с турнирной таблицей.</p>
      </div>`;
    if (ui.homeStep === 'avatar' && sel) {
      const name = sel === 'new' ? LS.get('pg_name', '') : PROFILES.find((p) => p.id === sel)?.name;
      return `${header}<main class="home wide">
        <form class="card home-card" data-form="enter">
          <div class="step-h"><button type="button" class="btn sm ghost" data-act="home-back">${ic('back', 16)} Назад</button><span class="lbl">Шаг 2 из 2 · Твой персонаж на эту игру</span></div>
          <h2 class="h2">Привет, ${esc(name || 'игрок')}! Собери аватар</h2>
          ${avatarEditor(ui.avatar, 'home')}
          <div class="enter-row">
            ${
              code
                ? `<button class="btn primary big" type="submit" name="go" value="join">Войти в комнату ${esc(code)}</button><button class="btn ghost" type="submit" name="go" value="create">или создать новую</button>`
                : `<button class="btn primary big" type="submit" name="go" value="create">Создать комнату</button>
                   <div class="row code-row"><input class="inp code-inp" name="code" data-keep="home-code" maxlength="4" placeholder="КОД" autocomplete="off" /><button class="btn" type="submit" name="go" value="join">Войти по коду</button></div>`
            }
          </div>
          ${connected ? '' : '<p class="muted small">Подключаемся к серверу…</p>'}
        </form>
      </main>`;
    }
    // На шаге 1 аватара ещё нет — только инициалы
    const tiles = PROFILES.map((p) =>
      `<button type="button" class="pick-tile ${sel === p.id ? 'on' : ''}" data-act="home-pick" data-id="${p.id}">${avaHtml({ name: p.name }, 'lg')}<span>${esc(p.name)}</span></button>`
    ).join('');
    return `${header}<main class="home">
      ${hero}
      <form class="card home-card" data-form="who">
        <span class="lbl">Шаг 1 из 2 · Кто ты?</span>
        <div class="pick-grid">
          ${tiles}
          <button type="button" class="pick-tile new ${sel === 'new' ? 'on' : ''}" data-act="home-pick" data-id="new"><span class="ava lg plus" style="width:${SIZES.lg}px;height:${SIZES.lg}px">${ic('plus', 24)}</span><span>Новый игрок</span></button>
        </div>
        ${sel === 'new' ? `<input class="inp" name="name" data-keep="home-name" maxlength="24" placeholder="Как тебя зовут?" value="${esc(LS.get('pg_name', ''))}" autocomplete="nickname" />` : ''}
        <button class="btn primary big" type="submit" ${sel ? '' : 'disabled'}>Дальше — аватар</button>
      </form>
    </main>`;
  }

  // ---------- комната ----------
  function renderRoom() {
    const r = S.room;
    const g = S.game;
    const t = tour();
    const meta = gameMeta(g ? g.type : ui.selected);
    let stage;
    if (t && t.phase === 'final') stage = renderTourFinal();
    else if (g) stage = (t ? renderTourStrip() + renderTourBetween() : '') + renderGame(g);
    else stage = renderLobby();
    const title = g ? `${gIcon(g.type)}<span>${esc(meta.title)}</span>` : t ? `${ic('trophy')}<span>Марафон</span>` : `<span class="muted">Лобби</span>`;
    return `
    <div class="room ${g ? 'in-game game-' + g.type : 'in-lobby'}">
      <header class="topbar">
        <div class="tb-row">
          <div class="brand">${ic('dice', 22)}<b>Экранки</b></div>
          <div class="gtitle">${title}</div>
          <div class="top-actions">
            ${g || !t ? `<button class="btn sm ghost" data-act="rules" title="Правила">${ic('book')}<span class="hide-m">Правила</span></button>` : ''}
            ${sfxMenu()}
            ${themeMenu()}
            <button class="btn sm code-btn" data-act="copy" title="Скопировать ссылку на комнату">${ic('link', 16)}<span>${esc(r.code)}</span></button>
          </div>
        </div>
        ${renderStrip()}
        ${g && g.type === 'codenames' ? renderClock(g) : ''}
      </header>
      ${!connected ? '<div class="offline">Нет соединения, переподключаемся…</div>' : ''}
      <main class="stage ${ui.enter ? 'enter' : ''}">
        ${stage}
      </main>
      ${renderChat()}
      ${ui.showRules ? renderRules() : ''}
      ${ui.showSum && g && g.type === 'codenames' && g.winner ? cnSummaryModal(g) : ''}
      ${ui.avEdit ? renderAvatarModal() : ''}
    </div>`;
  }

  // Второй этаж хедера: все игроки и зрители
  function renderStrip() {
    const r = S.room;
    const g = S.game;
    const cn = g && g.type === 'codenames' ? g : null;
    const people = r.players
      .map((p) => {
        const team = cn ? cn.team[p.id] : null;
        const cap = cn && (cn.captain.red === p.id || cn.captain.blue === p.id);
        const tag = cn ? (team ? (cap ? 'капитан' : '') : 'зритель') : '';
        const open = ui.menu === 'p:' + p.id;
        const mine = p.id === S.me;
        const items = [];
        if (mine) items.push(`<button class="pop-i" data-act="av-open">${ic('palette', 16)}<span>Изменить аватар</span></button>`);
        if (mine && !p.profile && !g) items.push(`<button class="pop-i" data-act="rename">${ic('pencil', 16)}<span>Изменить имя</span></button>`);
        if (isHost() && !mine) {
          items.push(`<button class="pop-i" data-act="makeHost" data-pid="${p.id}">${ic('crown', 16)}<span>Сделать хостом</span></button>`);
          items.push(`<button class="pop-i danger" data-act="kick" data-pid="${p.id}">${ic('x', 16)}<span>Выгнать</span></button>`);
        }
        return `<div class="menu-wrap" data-pop>
          <button data-pm="${p.id}" class="pm ${p.connected ? '' : 'off'} ${mine ? 'me' : ''}" ${items.length ? `data-act="menu" data-menu="p:${p.id}"` : ''} title="${esc(p.name)}${p.connected ? '' : ' — офлайн'}">
            ${avaHtml(p, 26, 'round')}
            <span class="pm-n">${esc(p.name)}</span>
            ${p.id === r.hostId ? `<span class="pm-host" title="Хост">${ic('crown', 13)}</span>` : ''}
            ${tag ? `<span class="pm-tag">${tag}</span>` : ''}
          </button>
          ${open && items.length ? `<div class="pop">${items.join('')}</div>` : ''}
        </div>`;
      })
      .join('');
    return `<div class="tb-strip">
      <span class="strip-l">${ic('users', 16)}<b>${r.players.length}</b></span>
      <div class="strip-list">${people}</div>
      ${!g && !tour() ? `<button class="btn sm ghost leave-btn" data-act="leave" title="Выйти из комнаты">${ic('logout', 16)}<span class="hide-m">Выйти</span></button>` : ''}
    </div>`;
  }

  function renderChat() {
    const r = S.room;
    const g = S.game;
    if (ui.chatOpen) ui.chatSeen = r.chat.length;
    const unread = Math.max(0, r.chat.length - ui.chatSeen);
    const hostTools = g && isHost();
    const ctlOpen = hostTools && ui.menu === 'ctl';
    return `<div class="chat-dock ${ui.chatOpen ? 'open' : ''}">
      ${
        ui.chatOpen
          ? `<div class="chat-panel card">
              <div class="chat-h"><b>${ic('chat', 16)} Чат</b><button class="icon-x" data-act="chat" title="Свернуть">${ic('chevron', 18)}</button></div>
              <div class="chat-log">${r.chat.length ? r.chat.map((m) => `<div class="msg">${pa(m.pid, 'xs')}<div><b>${esc(m.name)}</b> ${esc(m.text)}</div></div>`).join('') : '<div class="muted small">Сообщений пока нет</div>'}</div>
              <form data-form="chat" class="chat-form"><input class="inp" name="text" data-keep="chat" maxlength="300" placeholder="Сообщение…" autocomplete="off"/><button class="btn sm primary icon-btn" title="Отправить">${ic('send', 16)}</button></form>
            </div>`
          : ''
      }
      <div class="fab-row">
        ${
          hostTools
            ? `<div class="menu-wrap" data-pop>
                <button class="chat-fab gear ${ctlOpen ? 'on' : ''}" data-act="menu" data-menu="ctl" title="Управление игрой (хост)">${ic('gear', 22)}${g.clock?.paused ? '<i class="badge warn-b">II</i>' : ''}</button>
                ${ctlOpen ? renderControls(g) : ''}
              </div>`
            : ''
        }
        <button class="chat-fab" data-act="chat" title="${ui.chatOpen ? 'Свернуть чат' : 'Чат'}">${ic(ui.chatOpen ? 'x' : 'chat', 22)}${unread && !ui.chatOpen ? `<i class="badge">${unread > 9 ? '9+' : unread}</i>` : ''}</button>
      </div>
    </div>`;
  }

  function renderAvatarModal() {
    return `<div class="modal-bg" data-act="av-cancel"></div>
      <div class="modal card" role="dialog" aria-label="Аватар">
        <div class="modal-h"><b>Твой аватар</b><button class="icon-x" data-act="av-cancel">${ic('x', 18)}</button></div>
        ${avatarEditor(ui.avEdit, 'room')}
        <div class="row end"><button class="btn ghost" data-act="av-cancel">Отмена</button><button class="btn primary" data-act="av-save">Сохранить</button></div>
      </div>`;
  }

  // Правила — модалка поверх всего, вкладки по играм. Тексты — public/js/rules.js
  function renderRules() {
    const id = RULES[ui.showRules] ? ui.showRules : 'codenames';
    const R = RULES[id];
    const tabs = [...GAMES.map((x) => x.id), 'tour'].filter((k) => RULES[k]);
    const sec = (icon, title, body) => `<section class="rl-sec"><h4>${ic(icon, 16)} ${title}</h4>${body}</section>`;
    return `<div class="modal-bg rules-bg ${ui.rulesAnim ? 'anim' : ''}" data-act="rules"></div>
    <div class="modal rules-modal card ${ui.rulesAnim ? 'anim' : ''}" role="dialog" aria-modal="true" aria-label="Правила">
      <div class="rl-top">
        <div class="rl-tabs">${tabs.map((k) => `<button class="${k === id ? 'on' : ''}" data-act="rules-tab" data-g="${k}">${k === 'tour' ? ic('trophy', 16) : gIcon(k, 16)}<span>${esc(RULES[k].title)}</span></button>`).join('')}</div>
        <button class="icon-x" data-act="rules" title="Закрыть (Esc)">${ic('x', 20)}</button>
      </div>
      <div class="rl-body" data-g="${id}">
        <div class="rl-hero">
          <span class="rl-ic">${id === 'tour' ? ic('trophy', 30) : gIcon(id, 30)}</span>
          <div><h3>${esc(R.title)}</h3><p>${esc(R.goal)}</p>${R.meta ? `<div class="rl-meta">${R.meta.map((m) => `<span>${esc(m)}</span>`).join('')}</div>` : ''}</div>
        </div>
        ${R.roles ? sec('users', 'Кто есть кто', `<div class="rl-roles">${R.roles.map((r) => `<div class="rl-role"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>`) : ''}
        ${sec('list', 'Как проходит игра', `<ol class="rl-steps">${R.steps.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`)}
        ${R.timers ? sec('clock', 'Время', `<div class="rl-pts">${R.timers.map((p) => `<div class="rl-pt t ${p[0].startsWith('−') ? 'neg' : ''}"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join('')}</div>`) : ''}
        ${R.points ? sec('star', 'Очки', `<div class="rl-pts">${R.points.map((p) => `<div class="rl-pt ${p[0].startsWith('−') ? 'neg' : p[0] === '0' ? 'zero' : ''}"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join('')}</div>`) : ''}
        ${sec('trophy', 'Кто побеждает', `<p class="rl-win">${esc(R.win)}</p>`)}
        ${R.tips ? sec('bulb', 'Полезно знать', `<ul class="rl-tips">${R.tips.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`) : ''}
      </div>
      <div class="rl-foot"><button class="btn primary" data-act="rules">Понятно</button></div>
    </div>`;
  }

  // ---------- управление хоста (открывается шестерёнкой у чата) ----------
  function renderControls(g) {
    const t = tour();
    const btn = (actName, icon, label, cls = '') => `<button class="ctl ${cls}" data-act="${actName}">${ic(icon, 18)}<span>${label}</span></button>`;
    const items = [];
    if (g.type === 'codenames') {
      if (isPrep(g)) items.push(btn('cn-force', 'play', 'Начать без ожидания'));
      if (g.clock) items.push(btn('cn-pause', g.clock.paused ? 'play' : 'pause', g.clock.paused ? 'Продолжить таймер' : 'Пауза таймера', g.clock.paused ? 'hot' : ''));
      if (!g.winner) items.push(btn('cn-reset', 'reset', 'Перезапустить таймер'));
      items.push(btn('cn-shuffle', 'shuffle', 'Перемешать команды'));
      if (!t) items.push(btn('cn-new', 'grid', 'Новая доска'));
      if (!g.winner) items.push(btn('cn-end', 'skip', 'Передать ход'));
    } else if (g.type === 'alias') {
      if (['ready', 'running', 'review'].includes(g.phase)) items.push(btn('al-skipturn', 'skip', 'Пропустить ход'));
      if (g.phase === 'teams') items.push(btn('al-shuffle', 'shuffle', 'Перемешать команды'));
      if (!t) items.push(btn('al-restart', 'reset', 'Начать заново'));
    } else if (g.type === 'spyfall') {
      if (g.phase !== 'over') items.push(btn('spy-reveal', 'eye', 'Открыть карты'));
      if (!t) items.push(btn('spy-next', 'reset', 'Новый раунд'));
    } else if (g.type === 'whoami') {
      if (g.phase === 'play') items.push(btn('who-next', 'skip', 'Передать ход'));
      if (g.phase === 'write') items.push(btn('who-force', 'play', 'Начать сейчас'));
    } else if (g.type === 'justone') {
      if (g.phase === 'clues') items.push(btn('jo-force', 'skip', 'Не ждать остальных'));
      if (!t) items.push(btn('jo-restart', 'reset', 'Начать заново'));
    }
    items.push('<span class="ctl-sep"></span>');
    items.push(btn('stop', 'home', 'В лобби (пауза)'));
    return `<div class="pop ctl-pop ${ui.popAnim ? 'anim' : ''}"><div class="ctl-h">${ic('crown', 14)} Управление игрой</div>${items.join('')}</div>`;
  }

  // ---------- лобби ----------
  function renderLobby() {
    const host = isHost();
    const sel = ui.selected || S.room.gameType;
    const meta = gameMeta(sel);
    const link = roomLink(S.room.code);
    const sp = S.room.suspended;
    const paused = sp
      ? `<div class="card resume-card">
          <div class="rc-ic">${gIcon(sp.type, 28)}</div>
          <div class="rc-txt"><b>${sp.tour ? 'Марафон' : `«${esc(gameMeta(sp.type).title)}»`} на паузе</b><span class="muted small">${host ? 'Игра сохранена — можно вернуться в любой момент. Новая игра её заменит.' : 'Ждём, пока хост вернётся к игре.'}</span></div>
          ${host ? `<button class="btn primary big-w" data-act="resume">${ic('play', 16)} Вернуться к игре</button>` : ''}
        </div>`
      : '';
    const invite = `<div class="invite card">
        <div><div class="lbl">Пригласите друзей по ссылке</div><div class="link">${esc(link)}</div></div>
        <button class="btn primary" data-act="copy">${ic('link', 16)} Скопировать</button>
      </div>`;
    if (!host)
      return `<div class="lobby">${paused}${invite}<div class="card center big-pad"><div class="big-ic">${ic('dice', 44)}</div><h2 class="h2">Хост выбирает игру</h2>
        <p class="muted">${nm(S.room.hostId)} настраивает игру или марафон. Пока можно почитать правила.</p></div>
        <div class="games-grid">${GAMES.map((x) => gameCard(x, false, sel)).join('')}</div></div>`;
    const tabs = `<div class="tabs"><button class="${ui.mode === 'single' ? 'on' : ''}" data-act="mode" data-m="single">${ic('grid', 16)} Одна игра</button><button class="${ui.mode === 'tour' ? 'on' : ''}" data-act="mode" data-m="tour">${ic('trophy', 16)} Марафон</button></div>`;
    if (ui.mode === 'tour') return `<div class="lobby">${paused}${invite}${tabs}${renderTourBuilder()}</div>`;
    return `<div class="lobby">${paused}${invite}${tabs}
      <div class="games-grid">${GAMES.map((x) => gameCard(x, true, sel)).join('')}</div>
      <div class="card settings">
        <div class="settings-h"><b>${gIcon(meta.id)} ${esc(meta.title)}</b> <button class="link-btn" data-act="rules">как играть и как считаются очки?</button></div>
        <form data-form="start" class="set-form">
          ${(meta.settings || []).map((x) => renderSetting(x)).join('')}
          <button class="btn primary big" type="submit">${ic('play', 16)} Начать игру</button>
        </form>
      </div></div>`;
  }

  const gameCard = (g, clickable, sel) => `<button class="gcard ${g.id === sel && clickable ? 'active' : ''}" ${clickable ? `data-act="pick" data-id="${g.id}"` : 'disabled'}>
      <span class="gemoji">${gIcon(g.id, 28)}</span>
      <span class="gname">${esc(g.title)}</span>
      <span class="gshort">${esc(g.short)}</span>
      <span class="gplayers">${ic('users', 14)} ${esc(g.players)}</span>
    </button>`;

  function renderSetting(s, prefix = '') {
    const key = prefix + s.key;
    const v = ui.settings[key] ?? s.default;
    if (s.type === 'select') {
      // Свой дропдаун вместо системного <select>
      const opts = s.options.map((o) => (typeof o === 'object' ? { v: o.v, t: o.t } : { v: o, t: String(o) }));
      const cur = opts.find((o) => String(o.v) === String(v)) || opts[0];
      const open = ui.menu === 'dd:' + key;
      return `<div class="set"><span>${esc(s.label)}</span><div class="dd ${open ? 'open' : ''}" data-pop>
        <input type="hidden" name="${key}" value="${esc(cur.v)}" />
        <button type="button" class="dd-btn" data-act="dd-open" data-key="${key}" aria-haspopup="listbox" aria-expanded="${open}"><span>${esc(cur.t)}</span>${ic('chevron', 18, 'dd-car')}</button>
        ${open ? `<div class="pop dd-list ${ui.popAnim ? 'anim' : ''}" role="listbox">${opts.map((o) => `<button type="button" class="pop-i ${String(o.v) === String(cur.v) ? 'on' : ''}" data-act="dd-pick" data-key="${key}" data-v="${esc(o.v)}" role="option"><span>${esc(o.t)}</span>${String(o.v) === String(cur.v) ? ic('check', 16, 'tick') : ''}</button>`).join('')}</div>` : ''}
      </div></div>`;
    }
    if (s.type === 'checkbox') return `<label class="set check"><input type="checkbox" name="${key}" ${v ? 'checked' : ''}/><span>${esc(s.label)}</span></label>`;
    if (s.type === 'textarea')
      return `<label class="set wide"><span>${esc(s.label)}</span><textarea class="inp" name="${key}" data-keep="set-${key}" rows="2" placeholder="слово, ещё слово, …"></textarea></label>`;
    return '';
  }

  // ---------- марафон ----------
  function renderTourBuilder() {
    let total = 0;
    const rows = ui.mOrder
      .map((id, k) => {
        const m = gameMeta(id);
        const on = !!ui.mOn[id];
        const rounds = ui.mRounds[id] || 1;
        if (on) total += rounds;
        return `<div class="mrow ${on ? 'on' : ''}">
          <div class="mhead">
            <label class="mcheck"><input type="checkbox" data-mon="${id}" ${on ? 'checked' : ''}/><span class="mname">${gIcon(id)} ${esc(m.title)}</span></label>
            <div class="mctl">
              ${on ? `<span class="muted small hide-m">каток</span><div class="stepper"><button type="button" data-act="m-rounds" data-id="${id}" data-d="-1">−</button><b>${rounds}</b><button type="button" data-act="m-rounds" data-id="${id}" data-d="1">+</button></div>` : ''}
              <button type="button" class="icon-x mv" data-act="m-move" data-id="${id}" data-d="-1" ${k === 0 ? 'disabled' : ''} title="Выше">${ic('up', 16)}</button>
              <button type="button" class="icon-x mv" data-act="m-move" data-id="${id}" data-d="1" ${k === ui.mOrder.length - 1 ? 'disabled' : ''} title="Ниже">${ic('down', 16)}</button>
            </div>
          </div>
          ${on && (m.settings || []).length ? `<details class="mset" data-mopen="${id}" ${ui.mOpen[id] ? 'open' : ''}><summary>Настройки</summary><div class="set-form">${m.settings.map((x) => renderSetting(x, id + '__')).join('')}</div></details>` : ''}
        </div>`;
      })
      .join('');
    return `<form data-form="tour" class="card tour-form">
        <div class="settings-h"><b>${ic('trophy')} Марафон</b><span class="muted small">Отметьте игры, задайте порядок и число каток</span></div>
        ${rows}
        <div class="mfoot"><span>Всего: <b>${total}</b> ${plural(total, 'катка', 'катки', 'каток')}</span><button class="btn primary" type="submit" ${total ? '' : 'disabled'}>${ic('trophy', 16)} Начать марафон</button></div>
        <p class="small muted mnote">За каждую катку: 1-е место — 3 очка, 2-е — 2, 3-е — 1. Турнирная таблица откроется после последней катки.</p>
      </form>`;
  }

  function tourRows() {
    const t = tour();
    const ids = new Set([...S.room.players.map((p) => p.id), ...Object.keys(t.totals)]);
    const types = [...new Set(t.queue.map((q) => q.type))];
    const rows = [...ids]
      .map((id) => {
        const per = {};
        for (const l of t.log) per[l.type] = (per[l.type] || 0) + (l.pts[id] || 0);
        return { id, total: t.totals[id] || 0, per };
      })
      .sort((a, b) => b.total - a.total);
    return { rows, types };
  }

  function tourTable() {
    const { rows, types } = tourRows();
    let place = 0;
    let last = null;
    return `<div class="ttable-wrap"><table class="ttable"><thead><tr><th>#</th><th>Игрок</th>${types.map((ty) => `<th title="${esc(gameMeta(ty).title)}">${gIcon(ty, 16)}</th>`).join('')}<th>Итого</th></tr></thead><tbody>
      ${rows
        .map((r, i) => {
          if (r.total !== last) place = i + 1;
          last = r.total;
          return `<tr class="${r.id === S.me ? 'me' : ''}"><td>${place}</td><td>${player(r.id) ? who(r.id, 'sm') : '<span class="muted">ушёл</span>'}</td>${types.map((ty) => `<td>${r.per[ty] || 0}</td>`).join('')}<td><b>${r.total}</b></td></tr>`;
        })
        .join('')}</tbody></table></div>`;
  }

  function renderTourStrip() {
    const t = tour();
    const item = t.queue[t.idx];
    const m = gameMeta(item.type);
    const { rows } = tourRows();
    const top = rows.slice(0, 3).filter((r) => r.total > 0);
    return `<div class="tstrip">
      <span class="tstep">${ic('trophy', 16)} Катка <b>${t.idx + 1}</b> из ${t.queue.length}</span>
      <span class="muted">${esc(m.title)}${item.of > 1 ? ` · ${item.n}/${item.of}` : ''}</span>
      <span class="ttop">${top.map((r) => `${pa(r.id, 'xs')}<b>${r.total}</b>`).join(' ')}</span>
      <button class="btn xs ghost" data-act="tour-table">${ui.showTable ? 'Скрыть таблицу' : 'Таблица'}</button>
    </div>${ui.showTable && t.phase === 'play' ? `<div class="card">${tourTable()}</div>` : ''}`;
  }

  function renderTourBetween() {
    const t = tour();
    if (t.phase !== 'between' && t.phase !== 'done') return '';
    const l = t.log[t.log.length - 1];
    const placed = Object.entries(l.pts)
      .filter(([, p]) => p > 0)
      .sort((a, b) => b[1] - a[1]);
    const next = t.queue[t.idx + 1];
    const PL = { 3: '1-е место', 2: '2-е место', 1: '3-е место' };
    return `<div class="card tour-between">
      <div class="kicker">Катка ${t.idx + 1} из ${t.queue.length} окончена</div>
      <div class="tb-pts">${placed.length ? placed.map(([id, p]) => `<div class="tb-row">${who(id, 'sm')}<span class="muted small">${PL[p]}</span><b>+${p}</b></div>`).join('') : '<p class="muted">В этой катке никто не набрал очков</p>'}</div>
      ${tourTable()}
      <div class="row c">${
        isHost()
          ? next
            ? `<button class="btn primary big-w" data-act="tour-next">Дальше: ${esc(gameMeta(next.type).title)} ${ic('play', 16)}</button>`
            : `<button class="btn primary big-w" data-act="tour-next">${ic('trophy', 16)} Итоги марафона</button>`
          : `<span class="muted">Ждём, пока ${nm(S.room.hostId)} запустит ${next ? 'следующую катку' : 'итоги'}</span>`
      }</div>
    </div>`;
  }

  // Номинации марафона — считаются из того, что происходило в играх
  const NOM_IC = { captain: 'crown', sniper: 'target', hints: 'heartf', detector: 'eye', spy: 'spy', sherlock: 'question', explainer: 'mic' };
  function tourNoms() {
    const list = tour()?.nominations || [];
    if (!list.length) return '';
    return `<div class="noms"><div class="kicker">Номинации вечера</div><div class="nom-grid">${list
      .map(
        (n) => `<div class="nom"><span class="nom-ic">${ic(NOM_IC[n.key] || 'star', 20)}</span><b class="nom-t">${esc(n.title)}</b>
          <span class="nom-who">${n.pids.map((id) => `<span class="who-n">${pa(id, 'sm', 'round')}<span>${nm(id)}</span></span>`).join('')}</span>
          <span class="nom-u">${n.n} — ${esc(n.unit)}</span></div>`
      )
      .join('')}</div></div>`;
  }

  function renderTourFinal() {
    const { rows } = tourRows();
    const podium = rows.slice(0, 3);
    const order = [1, 0, 2].filter((i) => podium[i]);
    return `<div class="card center big-pad final">
      <div class="kicker">Марафон окончен</div>
      <h2 class="h2">${ic('trophy', 24)} ${podium[0] ? nm(podium[0].id) : ''} — чемпион!</h2>
      <div class="podium">${order
        .map((i) => `<div class="pod p${i + 1}">${pa(podium[i].id, 'lg')}<div class="pod-n">${nm(podium[i].id)}</div><div class="pod-bar"><span>${i + 1}</span><b>${podium[i].total} ${plural(podium[i].total, 'очко', 'очка', 'очков')}</b></div></div>`)
        .join('')}</div>
      ${tourNoms()}
      ${tourTable()}
      ${isHost() ? `<div class="row c"><button class="btn primary" data-act="tour-end">${ic('home', 16)} Вернуться в лобби</button></div>` : ''}
    </div>`;
  }

  // ---------- игры ----------
  function renderGame(g) {
    const fn = { codenames: rCodenames, alias: rAlias, spyfall: rSpy, whoami: rWho, justone: rJust }[g.type];
    return fn ? fn(g) : '<p>Неизвестная игра</p>';
  }
  const canRestart = () => isHost() && !tour();

  const timerHtml = (endsAt, total) => {
    if (!endsAt) return '';
    const left = endsAt - now();
    const w = total ? Math.max(0, Math.min(100, (left / (total * 1000)) * 100)) : 100;
    return `<div class="timer ${left < 10000 ? 'low' : ''}" data-ends="${endsAt}" data-total="${total || 0}"><span class="t">${fmt(left)}</span><i style="width:${w}%"></i></div>`;
  };

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  let lastTickSec = null;
  function tick() {
    const n = now();
    // тикаем последние 5 секунд таймера хода
    const clk = document.querySelector('[data-clock]') || document.querySelector('.stage [data-ends]');
    if (clk && clk.dataset.paused !== '1') {
      const sec = Math.ceil((Number(clk.dataset.ends) - n) / 1000);
      if (sec >= 1 && sec <= 5 && sec !== lastTickSec) Sound.play('tick');
      lastTickSec = sec;
    }
    document.querySelectorAll('[data-ends]').forEach((el) => {
      const left = Number(el.dataset.ends) - n;
      const t = el.querySelector('.t');
      if (t) t.textContent = fmt(left);
      const total = Number(el.dataset.total) * 1000;
      const bar = el.querySelector('i');
      if (bar && total) bar.style.width = Math.max(0, Math.min(100, (left / total) * 100)) + '%';
      el.classList.toggle('low', left < 10000);
    });
    // Таймер хода Коднеймс под хедером
    document.querySelectorAll('[data-clock]').forEach((el) => {
      const paused = el.dataset.paused === '1';
      const left = paused ? Number(el.dataset.left) : Number(el.dataset.ends) - n;
      const total = Number(el.dataset.total);
      el.querySelector('.ck-fill').style.width = Math.max(0, Math.min(100, (left / total) * 100)) + '%';
      el.querySelector('.ck-t').textContent = fmt(left);
      el.classList.toggle('low', !paused && left < 10000);
    });
    // Кнопки, которые доступны ограниченное время (правка подсказки)
    document.querySelectorAll('[data-until]').forEach((el) => {
      const left = Number(el.dataset.until) - n;
      if (left <= 0) el.remove();
      else {
        const ring = el.querySelector('.ring-fg');
        if (ring) ring.style.strokeDashoffset = String(100 - (left / Number(el.dataset.span)) * 100);
        const s = el.querySelector('.secs');
        if (s) s.textContent = Math.ceil(left / 1000);
      }
    });
  }
  setInterval(tick, 200);

  const leaderboard = (pairs, mark) =>
    `<div class="leader">${pairs
      .sort((a, b) => b[1] - a[1])
      .map(([id, n], i) => `<div class="lrow ${id === mark ? 'turn' : ''} ${id === S.me ? 'me' : ''}"><span>${i === 0 && n > 0 ? `<span class="medal">${ic('medal', 14)}</span>` : ''}${who(id, 'sm')}</span><b>${n}</b></div>`)
      .join('')}</div>`;

  // Переносы по слогам (правила русского языка): вставляем мягкие переносы &shy;
  const HY = (() => {
    const a = '[абвгдеёжзийклмнопрстуфхцчшщъыьэюя]';
    const x = '[йъь]';
    const g = '[аеёиоуыэюя]';
    const c = '[бвгджзклмнпрстфхцчшщ]';
    return [
      new RegExp(`(${x})(${a}${a})`, 'gi'),
      new RegExp(`(${g}${c})(${c}${g})`, 'gi'),
      new RegExp(`(${c}${g})(${c}${g})`, 'gi'),
