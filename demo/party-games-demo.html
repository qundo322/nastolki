.qa-big { font-family: var(--display); font-size: clamp(24px, 3.4vw, 40px); line-height: 1.2; text-align: center; padding: 14px 8px 18px; word-break: break-word; }
.qa-big .muted { font-family: inherit; font-size: 18px; }
.qa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 8px 0 4px; }
.qa-c { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 104px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); border-top: 4px solid var(--line-strong); }
.qa-c.v-yes { border-top-color: var(--green); }
.qa-c.v-no { border-top-color: var(--red); }
.qa-c.v-live { border-top-color: var(--accent); border-style: dashed; border-top-style: solid; }
.qa-c-q { font-weight: 800; font-size: 16px; line-height: 1.3; }
.qa-c-q i { color: var(--muted); font-weight: 600; }
.qa-c-a { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.qa-c-v { font-family: var(--display); font-size: 15px; }
.qa-c.v-yes .qa-c-v { color: var(--green-text); }
.qa-c.v-no .qa-c-v { color: var(--red-text); }
.qa-c.v-live .qa-c-v { color: var(--accent-text); font-family: inherit; font-size: 13px; font-weight: 700; }
.qa-c-n { display: inline-flex; gap: 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
.qa-c-n i { font-style: normal; }
.qa-c-n .y { color: var(--green-text); }
.qa-c-n .n { color: var(--red-text); }
.qa-c.qa-ask { border: 2px dashed var(--accent-line); border-top: 4px solid var(--accent); background: var(--accent-soft); }
.qa-ask .inp { width: 100%; font-weight: 700; }
.qa-ask .btn { width: 100%; justify-content: center; }
.qa-hist .qa-grid { margin-top: 10px; }

/* Элиас — проверка слов карточками, кнопка всегда на виду */
.review { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 12px 0 0; flex-direction: initial; }
.review .rw { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; min-height: 92px; padding: 12px; border-radius: 14px; text-align: left; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; transition: transform .1s, border-color .15s, background .15s; }
.review .rw:hover { transform: translateY(-1px); }
.review .rw.ok { border-color: color-mix(in srgb, var(--green) 60%, transparent); background: color-mix(in srgb, var(--green) 12%, var(--surface-2)); }
.review .rw.no { border-color: color-mix(in srgb, var(--red) 50%, transparent); background: color-mix(in srgb, var(--red) 9%, var(--surface-2)); }
.review .rw.other { border-color: var(--accent-line); background: var(--accent-soft); }
.review .rw.last { border-style: dashed; }
.rw-ic { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); }
.rw.ok .rw-ic { color: var(--green-text); }
.rw.no .rw-ic { color: var(--red-text); }
.rw.other .rw-ic { color: var(--accent-text); }
.rw-w { font-weight: 800; font-size: 18px; line-height: 1.2; }
.review .rw em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); }
.rw.ok em { color: var(--green-text); }
.rw.no em { color: var(--red-text); }
.rv-sum { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.rv-sum span { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); }
.rv-sum .ok { color: var(--green-text); }
.rv-sum .no { color: var(--red-text); }
.rv-sum b { margin-left: auto; font-family: var(--display); font-size: 18px; }
.rv-cta { position: sticky; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 14px 0 6px; margin-top: 8px;
  background: linear-gradient(to bottom, transparent, var(--surface) 35%); }
.rl-pt.t b { color: var(--accent-text); }
.rl-pt.t.neg b { color: var(--red-text); }
.who { padding-bottom: 130px; }

/* Меню «Вид» */
.view-pop { min-width: 250px; }
.vp-h { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 4px; }
.vp-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.vp-toggle { width: 100%; }
.sw-t { margin-left: auto; flex: none; width: 34px; height: 20px; border-radius: 99px; background: var(--line-strong); position: relative; transition: background .15s; }
.sw-t::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw-t.on { background: var(--green); }
.sw-t.on::after { transform: translateX(14px); }
.vp-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px 6px 8px; }
.vp-seg button { height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font-weight: 800; cursor: pointer; font-family: var(--card-font); }
.vp-seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
[data-glow='off'] .turn-glow { display: none; }
/* Статус занимает всю зарезервированную высоту — без пустого зазора над полем */
.cn-status > :first-child { flex: 1 1 auto; }
.cn-status > .ready-box { align-items: center; }
.cn-status > .cn-clue { display: flex; }

#radio-pause { position: fixed; bottom: 22px; z-index: 71; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.3); transition: transform .12s, border-color .15s; left: 152px; }
#radio-pause[hidden] { display: none; }
#radio-pause:hover { transform: translateY(-1px); border-color: var(--accent-line); }
#radio-pause.paused { color: var(--accent-text); border-color: var(--accent); }
@media (max-width: 640px) { #radio-pause { bottom: 13px; left: 136px; width: 38px; height: 38px; } }
h1, h2, h3, h4, .h2, .tp-name, .gname, .mega-word, .qa-big, .rl-hero h3, .nom-t, .sum-t { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; }

/* ============ v16: панель команды без карточек, на разделителях ============ */
.cn-side { gap: 0; padding: 0; overflow: hidden auto; }
.cn-side > .tp-top, .cn-side > .tp-sec { padding-left: 16px; padding-right: 16px; }
.cn-side .tp-sec { padding-top: 12px; padding-bottom: 12px; border-top: 1px solid color-mix(in srgb, currentColor 0%, var(--line)); }
.cn-side.t-red .tp-sec { border-top-color: color-mix(in srgb, var(--red) 22%, transparent); }
.cn-side.t-blue .tp-sec { border-top-color: color-mix(in srgb, var(--blue) 24%, transparent); }
.tp-top { padding-top: 14px; padding-bottom: 14px; }
.tp-name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cn-side .tp-name { font-size: 18px; }
.cn-side.t-red .tp-name { color: var(--red-text); }
.cn-side.t-blue .tp-name { color: var(--blue-text); }
.cn-side .tp-turn { margin: 0; font-size: 11px; padding: 3px 8px; }
.tp-count { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.tp-count b { font-family: var(--display); font-size: 56px; line-height: 0.9; font-weight: 700; letter-spacing: -0.03em; }
.cn-side.t-red .tp-count b { color: var(--red-text); }

.tp-count span { display: flex; flex-direction: column; font-weight: 700; font-size: 14px; line-height: 1.25; }
.tp-count small { color: var(--muted); font-weight: 600; font-size: 12px; }
.tp-dots { display: flex; gap: 4px; margin-top: 12px; }
.tp-dots i { flex: 1; height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--text) 12%, transparent); transition: background .3s; }
.cn-side.t-red .tp-dots i.on { background: var(--cn-red); }
.cn-side.t-blue .tp-dots i.on { background: var(--cn-blue); }
/* игроки — строками, без серых подложек */
.cn-side .pcard { background: transparent; border: 0; border-radius: 0; padding: 0; gap: 6px; }
.cn-side .pcard.cap.active { box-shadow: none; }
.cn-side .tp-agents { gap: 0; }
.cn-side .tp-agents .pcard { padding: 10px 0; border-bottom: 1px solid var(--line); }
.cn-side .tp-agents .pcard:first-child { padding-top: 2px; }
.cn-side .tp-agents .pcard:last-child { border-bottom: 0; padding-bottom: 0; }
.cn-side.t-red .tp-agents .pcard { border-bottom-color: color-mix(in srgb, var(--red) 16%, transparent); }
.cn-side.t-blue .tp-agents .pcard { border-bottom-color: color-mix(in srgb, var(--blue) 18%, transparent); }
.cn-side .pcard.me .pc-n > span:first-child { color: var(--accent-text); }
.cn-side .pc-stats { gap: 12px; padding-left: 42px; }
.cn-side .ps { background: none; border: 0; padding: 0; font-size: 12px; }
.cn-side .ps b { font-size: 15px; }
.cn-side .pc-clues { border-top: 0; padding-top: 2px; padding-left: 0; }
.cn-side .pc-clues .hrow { padding: 5px 0; border-radius: 0; border-bottom: 1px dashed var(--line); }
.cn-side .pc-clues .hrow:last-child { border-bottom: 0; }
.cn-side .pc-clues .hrow.now { background: none; box-shadow: none; }
.cn-side .pc-clues .hrow.now .hword { color: var(--accent-text); }
.cn-side > .tp-in, .cn-side > .tp-join { margin: 0 16px 14px; }
.cn-side > .tp-in { padding-left: 0; padding-right: 0; }
@media (max-width: 760px) {
  .tp-count b { font-size: 40px; }
  .cn-side .pc-stats { padding-left: 0; }
  .cn-side .tp-agents { flex-direction: column; }
}

/* Участники — кнопка в шапке */
.people-btn { gap: 8px; padding-left: 6px; }
.pb-stack { display: inline-flex; }
.pb-stack .ava { box-shadow: 0 0 0 2px var(--topbar, var(--bg)); }
.pb-stack .ava + .ava { margin-left: -8px; }
.pb-n { display: inline-flex; align-items: center; gap: 4px; }
.people-pop { left: 0; right: auto; min-width: 290px; max-height: 70vh; overflow-y: auto; }
.pp-list { display: flex; flex-direction: column; }
.pp-row { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-bottom: 1px solid var(--line); }
.pp-row:last-child { border-bottom: 0; }
.pp-row.off { opacity: 0.5; }
.pp-n { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 700; }
.pp-n > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-n small { font-size: 12px; color: var(--muted); font-weight: 600; }

.pp-row.t-blue .pp-n small { color: var(--blue-text); }
.pp-acts { display: inline-flex; gap: 2px; }
.pp-acts .icon-x.danger:hover { color: var(--red-text); }
.cn-side, .tri-side { top: 96px; }
.cn-side { max-height: calc(100vh - 116px - var(--ctl-h)); }
@media (max-width: 640px) { .pb-stack { display: none; } }

/* ============ v17: форма капитана — 3 шага в одну строку, фиксированная высота ============ */
.cn-clue.cform { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 1.7fr) minmax(190px, 0.9fr); gap: 18px; align-items: stretch; height: 122px; padding: 12px 16px 12px 22px; margin-bottom: 8px; flex-wrap: nowrap; }
.cf-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; justify-content: flex-start; }
.cf-l { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf-l b { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
.cf-hint { font-weight: 600; color: var(--faint); margin-left: 4px; }
.cform .clue-word { height: 56px; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; padding: 0 14px; }
.cform .clue-word::placeholder { text-transform: none; font-weight: 600; font-size: 16px; letter-spacing: 0; }
/* карточки силы — в одну строку, лишние прокручиваются вбок */
.cform .slots { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; overflow-x: auto; overflow-y: hidden; height: 56px; padding-bottom: 2px; scrollbar-width: thin; }
.cform .slot { flex: none; height: 50px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.cform .slot input[type='range'] { width: 78px; }
.cform .slot .slot-v { width: 50px; height: 34px; padding: 0; font-size: 15px; }
.cform .slot-x { width: 22px; height: 22px; padding: 0; }
.cform .add-slot { flex: none; height: 50px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 12px; border: 1.5px dashed var(--accent-line); background: transparent; color: var(--accent-text); font: inherit; font-weight: 800; cursor: pointer; }
.cform .add-slot:hover { background: var(--accent-soft); }
.cf-pv { height: 22px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; font-weight: 800; }
.cf-pv .pv-word { text-transform: uppercase; margin-right: 4px; }
.cf-pv .num { display: inline-flex; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; align-items: center; justify-content: center; }
.cf-pv .num.bad { background: var(--red); color: #fff; }
.cf-btns { display: flex; gap: 6px; margin-top: auto; }
.cf-go { flex: 1; height: 46px; justify-content: center; font-size: 16px; }
@media (max-width: 900px) {
  .cn-clue.cform { grid-template-columns: 1fr; height: auto; gap: 10px; }
  .cform .clue-word { height: 48px; }
}

/* читаемая подпись фазы на цветной полосе таймера */
.clockbar:not(.idle) .ck-phase { color: inherit; opacity: 0.85; font-weight: 700; }
/* кнопка «Перейти за …» не вылезает за панель */
.cn-side > .tp-join, .cn-side > .tp-in { width: auto; align-self: stretch; box-sizing: border-box; }

/* Плашка-предложение включить свечение */
.glow-ask { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 95; display: flex; align-items: center; gap: 14px; width: min(640px, calc(100vw - 24px)); padding: 12px 14px; border-color: var(--accent-line); box-shadow: 0 12px 40px rgba(0,0,0,.4); }
.glow-ask.anim { animation: gaIn .3s cubic-bezier(.2,.9,.3,1); }
@keyframes gaIn { from { opacity: 0; transform: translate(-50%, 24px); } to { opacity: 1; transform: translate(-50%, 0); } }
.ga-ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; }
.ga-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ga-sw { flex: none; display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--text); font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
.ga-sw .sw-t { margin: 0; }
@media (max-width: 640px) { .glow-ask { flex-wrap: wrap; bottom: 70px; } .ga-t { flex-basis: calc(100% - 60px); } }
.cn-card { min-width: 0; }
.cn-card .w.phrase { font-size: 0.8em; }

/* ============ v18: форма капитана — под панелью своей команды ============ */
.cn-col { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 116px); overflow-y: auto; scrollbar-width: thin; }
.cn-col > .cn-side { position: static; max-height: none; overflow: visible; }
.cform.side { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft); }
.cf-head { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--accent-text); margin-bottom: 2px; }
.cform.side .cf-l { margin-top: 4px; }
.cform.side .cf-hint { margin: -4px 0 0; font-size: 12px; color: var(--faint); }
.cform.side .clue-word { height: 52px; font-size: 20px; font-weight: 800; text-transform: uppercase; padding: 0 12px; width: 100%; }
.cform.side .clue-word::placeholder { text-transform: none; font-size: 15px; font-weight: 600; }
.cform.side .slots { display: flex; flex-direction: column; gap: 6px; height: auto; overflow: visible; flex-wrap: nowrap; }
.cform.side .slot { width: 100%; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.cform.side .slot input[type='range'] { flex: 1; width: auto; min-width: 0; }
.cform.side .slot .slot-v { width: 52px; height: 32px; padding: 0; font-size: 15px; text-align: center; font-weight: 800; }
.cform.side .slot-x { width: 24px; height: 24px; padding: 0; flex: none; }
.cform.side .add-slot { height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 11px; border: 1.5px dashed var(--accent-line); background: transparent; color: var(--accent-text); font: inherit; font-weight: 800; cursor: pointer; }
.cform.side .add-slot:hover { background: var(--accent-soft); }
.cform.side .cf-pv { height: auto; min-height: 24px; white-space: normal; flex-wrap: wrap; }
.cform.side .cf-btns { margin-top: 6px; }
.cform.side .cf-go { height: 48px; }
.cn-clue.cap-turn { border-color: var(--accent-line); }
.cn-clue.cap-turn .cl-word { color: var(--accent-text); display: inline-flex; align-items: center; gap: 8px; }
@media (max-width: 760px) { .cn-col { position: static; max-height: none; overflow: visible; } .cn-col.t-blue { order: 2; } }

/* Карточка держит размер: текст не растягивает ряд, отсчёт — внутри угла */
.cn-card { overflow: hidden; }
.cn-card .pend { top: 6px; right: 6px; width: 30px; height: 30px; }
.cform.side .add-slot { width: 100%; flex: none; white-space: nowrap; padding: 0 12px; }
.cn-col { max-height: calc(100vh - 96px - 84px); }

/* ============ v19: Коднеймс — отрицательная сила и связки ============ */
.num.neg { background: var(--red) !important; color: #fff !important; }
.grp { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 5px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent-text); vertical-align: middle; }
.grp > .ic { margin-right: 2px; }
.plus-j { font-style: normal; font-weight: 800; color: var(--accent-text); padding: 0 1px; }
/* нить между карточками силы */
.cform.side .slots { gap: 0; }
.cform.side .slot { position: relative; }
.cform.side .slot.joined, .cform.side .slot.joined-next { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.cform.side .slot.neg { border-color: color-mix(in srgb, var(--red) 70%, transparent); }
.cform.side .slot.neg input[type='range'] { accent-color: var(--red); }
.cform.side .slot input[type='range'] { accent-color: var(--accent); }
.thread { position: relative; height: 26px; width: 100%; display: flex; align-items: center; gap: 8px; padding: 0 0 0 14px; background: none; border: 0; cursor: pointer; color: var(--faint); font: inherit; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.th-line { position: absolute; left: 21px; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--line-strong); transition: border-color .15s; }
.th-knot { position: relative; z-index: 1; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; transition: all .15s; }
.th-knot .ic { width: 10px; height: 10px; }
.thread:hover { color: var(--accent-text); }
.thread:hover .th-knot { border-color: var(--accent); }
.thread.on { color: var(--accent-text); }
.thread.on .th-line { border-left: 3px solid var(--accent); left: 20px; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
.thread.on .th-knot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ============ v20: Намёк понял ============ */
.jo-top { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; margin-bottom: 14px; }
.jo-tile { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.jo-tile.me { border-color: var(--accent-line); background: var(--accent-soft); }
.jt-k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.jt-v { font-family: var(--display); font-size: 34px; line-height: 1; display: flex; align-items: baseline; gap: 6px; }
.jt-v small { font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--muted); }
.jt-who { display: flex; align-items: center; gap: 10px; }
.jt-who b { font-family: var(--display); font-size: 22px; }
.jt-who small { font-size: 13px; color: var(--muted); font-family: var(--font); }
@media (max-width: 640px) { .jo-top { grid-template-columns: 1fr 1fr; } .jo-tile.wide { grid-column: 1 / -1; } .jt-v { font-size: 26px; } }
.justone .stage-card > .timer { align-self: stretch; }
.jo-sent { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; padding: 12px 18px; border-radius: 14px; background: var(--green-soft); color: var(--green-text); }
.jo-sent b { color: var(--text); font-size: 22px; }
/* кто готов */
.jo-ready { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 4px; }
.jr-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.jr { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: .45; filter: grayscale(.6); transition: opacity .2s, filter .2s; }
.jr.on { opacity: 1; filter: none; }
.jr small { font-size: 12px; font-weight: 700; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* крупные карточки подсказок */
.jc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; width: 100%; }
.jc { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 120px; padding: 18px 12px; border-radius: 18px; border: 2px solid var(--line-strong); background: var(--surface-2); color: var(--text); font: inherit; cursor: default; text-align: center; }
button.jc { cursor: pointer; transition: transform .1s, border-color .15s; }
button.jc:hover { transform: translateY(-2px); border-color: var(--accent-line); }
.jc b { font-family: var(--display); font-size: clamp(22px, 2.6vw, 34px); line-height: 1.1; word-break: break-word; }
.jc small { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 700; }
.jc.removed { opacity: .4; border-style: dashed; }
.jc.removed b { text-decoration: line-through; text-decoration-thickness: 3px; }
.jc.hearted { border-color: #ff5d7a; background: color-mix(in srgb, #ff5d7a 12%, var(--surface-2)); }
.jc-heart { position: absolute; top: 8px; right: 10px; color: #ff5d7a; }
/* решение «засчитать / не засчитывать» */
.ja-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ja-opt { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.ja-opt .btn { justify-content: center; }
.btn.ja-off { background: transparent; color: var(--red-text); box-shadow: inset 0 0 0 2px var(--red); border-color: transparent; }
.jo-ans { font-size: 18px; }
/* таблица с сердечками */
.jo-board .jb-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.jo-board .jb-row:last-child { border-bottom: 0; }
.jb-row.me .jb-n { color: var(--accent-text); }
.jb-row.turn { background: var(--accent-soft); border-radius: 10px; }
.jb-place { width: 20px; text-align: center; font-weight: 800; color: var(--muted); }
.jb-n { flex: 1; font-weight: 700; }
.jb-h { display: inline-flex; align-items: center; gap: 4px; color: #ff5d7a; font-weight: 800; font-size: 14px; }
.jb-p { font-family: var(--display); font-size: 20px; min-width: 32px; text-align: right; }
/* прошлые слова */
.jh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 8px; }
.jh { padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); border-top: 4px solid var(--line-strong); display: flex; flex-direction: column; gap: 6px; }
.jh.ok { border-top-color: var(--green); }
.jh.no { border-top-color: var(--red); }
.jh-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.jh-w { font-family: var(--display); font-size: 18px; }
.jh-st { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.jh.ok .jh-st { color: var(--green-text); }
.jh.no .jh-st { color: var(--red-text); }
.jh-g { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
.jh-h { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #ff5d7a; font-weight: 700; }
/* сердечки падают */
.heart-rain { position: fixed; inset: 0; z-index: 160; pointer-events: none; overflow: hidden; }
.heart-rain span { position: absolute; top: -60px; color: #ff5d7a; animation: hfall linear forwards; filter: drop-shadow(0 4px 10px rgba(255, 93, 122, .5)); }
@keyframes hfall { 0% { transform: translate(0, 0) rotate(-10deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx), 110vh) rotate(25deg); opacity: .9; } }

/* свечение сверху: думают над словом — жёлтое, угадывающий думает — синее */
.turn-glow.g-top-y, .turn-glow.g-top-b { left: 0; right: 0; top: 0; bottom: auto; width: auto; height: 45vh; }
.turn-glow.g-top-y { background: radial-gradient(ellipse 60% 100% at 50% 0%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%); }
.turn-glow.g-top-b { background: radial-gradient(ellipse 60% 100% at 50% 0%, color-mix(in srgb, var(--cn-blue) 30%, transparent), transparent 70%); }
.justone { position: relative; z-index: 1; }

/* сила свечения из меню «Вид» */
.turn-glow { animation-name: tglow2 !important; }
@keyframes tglow2 { 0%, 100% { opacity: calc(var(--glow-k, .9) * .45); } 50% { opacity: var(--glow-k, .9); } }
.turn-glow.g-red { background: radial-gradient(ellipse 70% 60% at 0% 55%, color-mix(in srgb, var(--cn-red) var(--glow-a, 30%), transparent), transparent 70%); }
.turn-glow.g-blue { background: radial-gradient(ellipse 70% 60% at 100% 55%, color-mix(in srgb, var(--cn-blue) var(--glow-a, 30%), transparent), transparent 70%); }
.turn-glow.g-top-y { background: radial-gradient(ellipse 60% 100% at 50% 0%, color-mix(in srgb, var(--accent) var(--glow-a, 30%), transparent), transparent 70%); }
.turn-glow.g-top-b { background: radial-gradient(ellipse 60% 100% at 50% 0%, color-mix(in srgb, var(--cn-blue) var(--glow-a, 30%), transparent), transparent 70%); }
[data-theme='oled'] .turn-glow { opacity: initial; }
.glow-seg button { font-family: var(--font); font-size: 12px; }
.glow-ask .glow-seg { flex: none; width: 300px; padding: 0; }
@media (max-width: 640px) { .glow-ask .glow-seg { width: 100%; } }

/* Элиас — последнее слово: кнопки команд их цветами */
.al-last { margin-top: 10px; padding: 14px; border-radius: 16px; border: 2px solid var(--accent); background: var(--accent-soft); display: flex; flex-direction: column; gap: 10px; }
.al-last.done { border-color: var(--line-strong); background: var(--surface-2); }
.al-last-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.al-last-h b { font-family: var(--display); font-size: 24px; }
.al-last-b { display: flex; flex-wrap: wrap; gap: 8px; }
.al-tb { flex: 1 1 140px; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; border: 2px solid var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); color: var(--text); font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; transition: transform .1s, background .15s; }
.al-tb small { font-weight: 600; color: var(--muted); }
.al-tb:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--tc) 26%, transparent); }
.al-tb.on { background: var(--tc); color: #111; }
.al-tb.on small { color: #111; }
.al-tb.none { --tc: var(--line-strong); }
.al-tb.none.on { background: var(--surface-3); color: var(--text); }

/* Кто я — большое поле вопроса */
.who-ask { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px; border-color: var(--accent-line); }
.wa-k { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); }
.wa-form { display: flex; gap: 10px; width: min(760px, 100%); }
.wa-inp { flex: 1; height: 64px; font-size: 24px; font-weight: 700; text-align: center; border-radius: 16px; }
.wa-form .btn.mega { height: 64px; }
.wa-live { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; width: min(760px, 100%); padding: 12px 16px; border-radius: 14px; background: var(--surface-2); }
.wa-q { font-family: var(--display); font-size: 20px; }
.who-timer { margin-bottom: 10px; }
.who-timer .timer { width: 100%; }
@media (max-width: 640px) { .wa-form { flex-direction: column; } .wa-inp { font-size: 19px; } }

/* Марафон: кубок у настроек и окно таблицы */
.trophy-fab { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.trophy-fab:hover { filter: brightness(1.06); }
.modal.tour-modal { width: min(820px, calc(100vw - 24px)); }
.tm-progress { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.tm-step { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--faint); }
.tm-step.done { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-line); }
.tm-step.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tm-podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.tmp { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
.tmp.p1 { border-color: var(--accent); background: var(--accent-soft); }
.tmp-place { position: absolute; top: 8px; left: 10px; font-family: var(--display); font-weight: 700; color: var(--muted); }
.tmp.p1 .tmp-place { color: var(--accent-text); }
.tmp-pts { font-family: var(--display); font-size: 26px; font-weight: 700; }
.tm-table { overflow-x: auto; }

/* плейлист: перетаскивание */
.lq-i { position: relative; transition: transform .15s; }
.lq-i.dragging { transition: none; z-index: 2; box-shadow: 0 8px 24px rgba(0,0,0,.35); background: var(--surface-3); outline: 1px solid var(--accent-line); }
.lq-grip { flex: none; width: 16px; cursor: grab; touch-action: none; user-select: none; color: var(--faint); font-weight: 800; letter-spacing: -2px; text-align: center; }
.lq-i.dragging .lq-grip { cursor: grabbing; color: var(--accent-text); }

/* ============ v21: Викторина ============ */
.quiz { position: relative; z-index: 1; }
.qz-head { grid-template-columns: 1fr 3fr; }
.qz-cat { font-size: 24px !important; }
.qz-card { gap: 16px; }
.qz-card > .timer { align-self: stretch; }
.qz-q { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3.2vw, 40px); line-height: 1.2; text-align: center; max-width: 900px; }
.qz-q.sm { font-size: clamp(18px, 2vw, 24px); color: var(--muted); }
.qz-form { align-items: center; }
.qz-inp { text-align: center; font-size: 30px !important; font-weight: 800; font-variant-numeric: tabular-nums; }
.qz-unit { font-weight: 800; color: var(--muted); white-space: nowrap; }
/* шкала */
.qz-reveal { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 14px; }
.qz-big { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
.qz-num { font-family: var(--display); font-weight: 700; font-size: clamp(56px, 9vw, 104px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent-text); text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 45%, transparent); }
.qz-u { font-size: 20px; font-weight: 800; color: var(--muted); }
.qz-bar { position: relative; height: 26px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line-strong); margin: 54px 0 54px; }
.qz-fill { position: absolute; inset: 0 auto 0 0; width: var(--p); border-radius: 99px; overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent), var(--accent)); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 60%, transparent);
  animation: qzfill 2.4s cubic-bezier(.2, .7, .2, 1) both; }
.qz-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); background-size: 200% 100%; animation: qzshine 1.2s linear infinite; }
@keyframes qzfill { from { width: 0; } to { width: var(--p); } }
@keyframes qzshine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
/* вспышка в точке правильного ответа */
.qz-hit { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px var(--accent); opacity: 0; animation: qzhit .9s cubic-bezier(.2,.9,.3,1) both; }
.qz-hit::before, .qz-hit::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--accent); animation: qzring 1s ease-out both; animation-delay: inherit; }
.qz-hit::after { animation-delay: inherit; inset: -14px; border-width: 2px; opacity: .6; }
@keyframes qzhit { 0% { opacity: 0; transform: scale(.2); } 40% { opacity: 1; transform: scale(1.6); } 100% { opacity: 1; transform: scale(1); } }
@keyframes qzring { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(3.2); opacity: 0; } }
/* маркеры игроков */
.qz-m { position: absolute; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; animation: qzpop .45s cubic-bezier(.2,.9,.3,1.3) both; z-index: 2; }
.qz-m.up { top: auto; bottom: 100%; transform: translate(-50%, 6px); flex-direction: column; }
.qz-m.dn { top: 100%; transform: translate(-50%, -6px); flex-direction: column-reverse; }
.qz-m .ava { box-shadow: 0 0 0 2px var(--surface); }
.qz-m.win .ava { box-shadow: 0 0 0 3px var(--green), 0 0 18px color-mix(in srgb, var(--green) 70%, transparent); }
.qz-mv { font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--surface-3); white-space: nowrap; }
.qz-m.win .qz-mv { background: var(--green); color: var(--green-ink); }
@keyframes qzpop { from { opacity: 0; scale: .3; } to { opacity: 1; scale: 1; } }
.qz-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); font-weight: 700; margin-top: -40px; }
.qz-list { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 4px; opacity: 0; animation: fadeIn .4s ease both; }
.qz-r { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.qz-r.win { background: var(--green-soft); box-shadow: inset 0 0 0 1px var(--green); }
.qz-rv { font-weight: 800; font-variant-numeric: tabular-nums; }
.qz-rd { font-size: 12px; color: var(--muted); min-width: 80px; text-align: right; }
.qz-r.win .qz-rd { color: var(--green-text); font-weight: 800; }
.qz-rp { min-width: 28px; text-align: right; font-family: var(--display); color: var(--green-text); }
.qz-w { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; color: var(--accent-text); }
@media (prefers-reduced-motion: reduce) { .qz-fill, .qz-hit, .qz-m, .qz-list { animation-duration: .01s !important; } }

/* дорожки меток на шкале */
.qz-bar.lanes-2 { margin: 104px 0 104px; }
.qz-bar.lanes-3 { margin: 154px 0 154px; }
.qz-m.up2 { top: auto; bottom: calc(100% + 50px); transform: translate(-50%, 6px); }
.qz-m.dn2 { top: calc(100% + 50px); transform: translate(-50%, -6px); flex-direction: column-reverse; }
.qz-m.up3 { top: auto; bottom: calc(100% + 100px); transform: translate(-50%, 6px); }
.qz-m.dn3 { top: calc(100% + 100px); transform: translate(-50%, -6px); flex-direction: column-reverse; }
.qz-bar.lanes-2 + .qz-scale { margin-top: -90px; }
.qz-bar.lanes-3 + .qz-scale { margin-top: -140px; }
.qz-scale { position: relative; z-index: 0; }
.qz-list .qz-r { text-align: left; }
.qz-list .jb-n { text-align: left; }

/* ============ v22: счётчик-ролик, вопросы двумя колонками, время в чате ============ */
.qa-b { position: relative; }
.roll { position: relative; display: inline-block; height: 1.1em; overflow: hidden; font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.1; color: #fff; min-width: 1ch; text-align: center; vertical-align: middle; }
.qa-b:not(.on) .roll { color: var(--text); }
.roll > span { display: block; }
.roll-o { position: absolute; inset: 0; animation: rollOut .42s cubic-bezier(.2,.8,.2,1) both; }
.roll-n.in { animation: rollIn .42s cubic-bezier(.2,.8,.2,1.15) both; }
.roll.down .roll-o { animation-name: rollOutD; }
.roll.down .roll-n.in { animation-name: rollInD; }
@keyframes rollIn { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rollOut { from { transform: none; opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
@keyframes rollInD { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rollOutD { from { transform: none; opacity: 1; } to { transform: translateY(100%); opacity: 0; } }
.qa-b { gap: 4px; min-height: 120px; }
.qa-b > b { font-size: 18px; }
.qa-asker { justify-content: center; font-size: 18px; gap: 10px; margin-bottom: 0; }
.qa-asker b { font-size: 20px; }
/* вопросы двумя колонками */
.qa-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.qa-col { border-radius: 14px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.qa-col.yes { border-top: 4px solid var(--green); }
.qa-col.no { border-top: 4px solid var(--red); }
.qa-col.idk { margin: 0 0 8px; border-top: 4px solid var(--line-strong); }
.qa-ch { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.qa-ch b { margin-left: auto; font-family: var(--display); font-size: 18px; }
.qa-col.yes .qa-ch { color: var(--green-text); }
.qa-col.no .qa-ch { color: var(--red-text); }
.qa-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.qa-row:last-child { border-bottom: 0; }
.qa-rq { font-weight: 700; font-size: 15px; line-height: 1.3; }
.qa-rn { flex: none; font-size: 11px; font-weight: 800; color: var(--muted); }
.qa-rn i { font-style: normal; }
.qa-rn .y { color: var(--green-text); }
.qa-rn .n { color: var(--red-text); }
@media (max-width: 640px) { .qa-cols { grid-template-columns: 1fr; } }
/* время в чате */
.msg { position: relative; }
.msg-t { margin-left: auto; flex: none; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; padding-left: 6px; }
.msg > div { flex: 1; min-width: 0; }

/* Панель хоста — ряд круглых кнопок рядом с шестерёнкой, открыта до закрытия */
.ctl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap-reverse; justify-content: flex-end; max-width: min(560px, calc(100vw - 150px)); padding: 6px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 70%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); }
.ctl-row.anim > * { animation: ctlIn .28s cubic-bezier(.2,.9,.3,1.25) both; }
.ctl-row.anim > *:nth-last-child(2) { animation-delay: .03s; } .ctl-row.anim > *:nth-last-child(3) { animation-delay: .06s; } .ctl-row.anim > *:nth-last-child(4) { animation-delay: .09s; }
.ctl-row.anim > *:nth-last-child(5) { animation-delay: .12s; } .ctl-row.anim > *:nth-last-child(6) { animation-delay: .15s; } .ctl-row.anim > *:nth-last-child(7) { animation-delay: .18s; } .ctl-row.anim > *:nth-last-child(8) { animation-delay: .21s; }
@keyframes ctlIn { from { opacity: 0; transform: translateX(24px) scale(.6); } to { opacity: 1; transform: none; } }
.chat-fab.ctl-fab { width: 46px; height: 46px; box-shadow: none; }
.ctl-fab:hover { border-color: var(--accent); color: var(--accent-text); }
.ctl-fab.hot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ctl-row .ctl-sep { width: 1px; height: 26px; background: var(--line-strong); margin: 0 2px; }
/* подпись при наведении */
.ctl-fab[data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 4px); white-space: nowrap; pointer-events: none;
  background: var(--surface-3); color: var(--text); border: 1px solid var(--line-strong); font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 8px; opacity: 0; transition: opacity .15s, transform .15s; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.ctl-fab[data-tip]:hover::after, .ctl-fab[data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
.chat-fab.gear.on { border-color: var(--accent); color: var(--accent-text); }
@media (hover: none) { .ctl-fab[data-tip]:active::after { opacity: 1; transform: translate(-50%, 0); } }
@media (max-width: 640px) { .chat-fab.ctl-fab { width: 42px; height: 42px; } .ctl-row { max-width: calc(100vw - 120px); border-radius: 22px; } }

/* «Викторина»: текст нельзя выделить и скопировать */
.room.game-quiz { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.room.game-quiz input, .room.game-quiz textarea { -webkit-user-select: text; user-select: text; }

/* общая полоса таймера для всех игр */
.clockbar.t-any .ck-fill { background: linear-gradient(90deg, color-mix(in srgb, var(--tc, var(--accent)) 55%, transparent), color-mix(in srgb, var(--tc, var(--accent)) 35%, transparent)); }
.clockbar.t-any.low .ck-fill { background: linear-gradient(90deg, color-mix(in srgb, var(--red) 60%, transparent), color-mix(in srgb, var(--red) 40%, transparent)); }

/* Кто я — удобная ширина и вопросы по порядку */
.who { max-width: 980px; margin: 0 auto; }
.who .qa-card, .who .notes-card, .who .who-ask { max-width: 820px; margin-left: auto; margin-right: auto; }
.qa-lines { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.qa-line { display: grid; grid-template-columns: 26px 1fr auto auto; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border-left: 4px solid var(--line-strong); }
.qa-line.v-yes { border-left-color: var(--green); }
.qa-line.v-no { border-left-color: var(--red); }
.ql-n { font-weight: 800; color: var(--faint); font-variant-numeric: tabular-nums; }
.ql-q { font-weight: 700; font-size: 16px; line-height: 1.3; }
.ql-v { font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--surface-3); color: var(--muted); }
.qa-line.v-yes .ql-v { background: var(--green); color: var(--green-ink); }
.qa-line.v-no .ql-v { background: var(--red); color: #fff; }
.ql-c { font-size: 11px; font-weight: 800; color: var(--faint); white-space: nowrap; }
.ql-c i { font-style: normal; }
.ql-c .y { color: var(--green-text); }
.ql-c .n { color: var(--red-text); }
.qa-split { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--accent-text); font-weight: 700; margin: -6px 0 10px; }
@media (max-width: 640px) { .qa-line { grid-template-columns: 22px 1fr auto; } .ql-c { display: none; } }

/* Выход */
.exit-btn:hover { color: var(--red-text); border-color: color-mix(in srgb, var(--red) 50%, transparent); }
.modal.leave-modal { width: min(420px, calc(100vw - 24px)); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 26px 24px 22px; }
.lm-ic { width: 56px; height: 56px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red-text); }
.leave-modal h3 { margin: 4px 0 0; font-family: var(--display); font-size: 22px; }
.leave-modal p { margin: 0; line-height: 1.45; }
.lm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
.lm-btns .btn { justify-content: center; height: 46px; }

/* Кнопки хоста — столбиком над шестерёнкой (speed dial) */
.ctl-wrap { position: relative; display: flex; }
.ctl-row { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); flex-direction: column-reverse; flex-wrap: nowrap; justify-content: flex-start; max-width: none; padding: 6px; border-radius: 30px; z-index: 5; }
.ctl-row .ctl-sep { width: 26px; height: 1px; margin: 2px auto; }
.ctl-row.anim > * { animation: dialIn .26s cubic-bezier(.2,.9,.3,1.3) both; }
.ctl-row.anim > *:nth-child(1) { animation-delay: 0s; } .ctl-row.anim > *:nth-child(2) { animation-delay: .03s; } .ctl-row.anim > *:nth-child(3) { animation-delay: .06s; }
.ctl-row.anim > *:nth-child(4) { animation-delay: .09s; } .ctl-row.anim > *:nth-child(5) { animation-delay: .12s; } .ctl-row.anim > *:nth-child(6) { animation-delay: .15s; } .ctl-row.anim > *:nth-child(7) { animation-delay: .18s; } .ctl-row.anim > *:nth-child(8) { animation-delay: .21s; }
@keyframes dialIn { from { opacity: 0; transform: translateY(26px) scale(.5); } to { opacity: 1; transform: none; } }
.ctl-row.closing > * { animation: dialOut .22s ease-in both; }
@keyframes dialOut { to { opacity: 0; transform: translateY(26px) scale(.5); } }
/* подпись — слева от кнопки */
.ctl-fab[data-tip]::after { bottom: auto; top: 50%; left: auto; right: calc(100% + 12px); transform: translate(4px, -50%); }
.ctl-fab[data-tip]:hover::after, .ctl-fab[data-tip]:focus-visible::after { transform: translate(0, -50%); }
@media (max-width: 640px) { .ctl-row { max-width: none; border-radius: 26px; } }
/* Кнопки хоста — раскрываются ВЛЕВО от шестерёнки (поверх остальных кнопок) */
.ctl-row { bottom: auto; top: 50%; left: auto; right: calc(100% + 10px); transform: translateY(-50%); flex-direction: row-reverse; border-radius: 99px; }
.ctl-row .ctl-sep { width: 1px; height: 26px; margin: 0 2px; }
@keyframes dialIn { from { opacity: 0; transform: translateX(26px) scale(.5); } to { opacity: 1; transform: none; } }
@keyframes dialOut { to { opacity: 0; transform: translateX(26px) scale(.5); } }
.ctl-fab[data-tip]::after { top: auto; right: auto; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 4px); }
.ctl-fab[data-tip]:hover::after, .ctl-fab[data-tip]:focus-visible::after { transform: translate(-50%, 0); }
@media (max-width: 640px) { .ctl-row { flex-wrap: wrap-reverse; max-width: calc(100vw - 110px); border-radius: 26px; } }
.qa-b.pending { outline: 3px solid var(--accent); outline-offset: 2px; }
.qa-b .pend { top: 8px; right: 8px; }
.ctl-fab.plus-t b { font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: -.02em; }

/* ---------- v23: «Ждём игроков» ---------- */
.wait-screen { display: grid; place-items: center; padding: 24px 0; }
.wait-card { width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 28px 22px; }
.wait-ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #000; }
.wait-card h2 { margin: 0; font-size: 26px; }
.wait-sub { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.wait-dots { display: inline-flex; gap: 4px; }
.wait-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: waitDot 1.2s infinite ease-in-out; }
.wait-dots i:nth-child(2) { animation-delay: .15s; }
.wait-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes waitDot { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.1); } }
.wait-need { margin: 0; color: var(--muted); font-size: 14px; }
.wait-people { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 6px 0; }
.wait-p { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; max-width: 72px; }
.wait-p > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 72px; }
.wait-p.off { opacity: .45; }
.wait-link { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; }
.wait-link .btn span { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wait-card .btn.big { width: 100%; margin-top: 6px; }

/* ---------- v24: «Ответ большинства» ---------- */
.mj-form .big-inp { text-align: center; }
.mj-task { font-size: 18px; }
.mj-groups { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mj-g { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px 14px 12px; border-radius: 16px; background: var(--surface-2); border: 2px solid transparent; text-align: left; animation: mjIn .45s cubic-bezier(.2, .9, .3, 1.2) both; transition: border-color .15s, transform .15s; }
.mj-g.host { cursor: pointer; }
.mj-g.host:hover { border-color: var(--line-strong); }
.mj-g.major { background: var(--accent-soft); border-color: var(--accent-line); }
.mj-g.sel, .mj-s.sel { border-color: var(--accent) !important; transform: translateY(-2px); box-shadow: 0 0 0 4px var(--accent-soft); }
@keyframes mjIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
.mj-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 3px 9px; border-radius: 999px; }
.mj-txt { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
.mj-txt i { color: var(--faint); font-style: normal; font-weight: 400; }
.mj-ppl { display: flex; flex-wrap: wrap; gap: 6px; }
.mj-p { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--surface-3); font-size: 13px; }
.mj-x { display: grid; place-items: center; width: 20px; height: 20px; margin-right: -6px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.mj-x:hover { background: var(--red-soft); color: var(--red-text); }
.mj-foot { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
.mj-n { font-family: var(--display); font-size: 30px; line-height: 1; }
.mj-g.major .mj-n { color: var(--accent-text); }
.mj-pts { margin-left: auto; font-size: 14px; color: var(--green-text); }
.mj-none { font-size: 18px; color: var(--muted); margin: 8px 0; }
.mj-solo { width: 100%; text-align: left; }
.mj-solo .side-h { margin-bottom: 8px; }
.mj-solo-l { display: flex; flex-wrap: wrap; gap: 8px; }
.mj-s { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface-2); border: 2px solid transparent; font-size: 15px; }
.mj-s.host { cursor: pointer; }
.mj-s.host:hover { border-color: var(--line-strong); }
.mj-tip { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; justify-content: center; }
.mj-tip.on { color: var(--accent-text); font-weight: 600; }

/* ---------- v24: готовые марафоны и оценка времени ---------- */
.m-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.m-pre { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; text-align: left; transition: border-color .15s, background .15s, transform .15s; }
.m-pre b { font-size: 16px; }
.m-pre span { font-size: 13px; color: var(--muted); }
.m-pre:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.m-pre.on { border-color: var(--accent); background: var(--accent-soft); }
.m-pre.on span { color: var(--accent-text); }
.m-est { white-space: nowrap; margin-right: 4px; }
.m-total { color: var(--accent-text); }
@media (max-width: 560px) { .m-presets { grid-template-columns: 1fr; } .m-pre { flex-direction: row; justify-content: space-between; align-items: center; } }

/* ---------- v25: вход в один шаг, своё фото, реальное имя ---------- */
/* Вход — по центру экрана */
.home { min-height: 100dvh; padding: 32px 20px; grid-template-columns: 1fr minmax(0, 460px); align-content: center; justify-content: center; }
.home-card { gap: 16px; }
.home-card > .lbl { margin: 0; }
@media (max-width: 820px) { .home { grid-template-columns: 1fr; max-width: 520px; gap: 20px; } .home-hero { text-align: center; } .home-hero .logo-mark { margin: 0 auto; } }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.fld .req { color: var(--accent-text); font-style: normal; }
.fld small { font-size: 12px; }
.fld .inp::placeholder { color: var(--faint); }

/* Аватар: фото поверх инициалов (если картинка не загрузится — останутся инициалы) */
.ava > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.ava.ring { box-shadow: 0 0 0 2px var(--ring); }
.ava[data-real] { cursor: help; }

/* Блок «Аватар» на входе и в профиле */
.ph-row { display: flex; align-items: center; gap: 16px; }
.ph-circle { --h: 200; position: relative; flex: none; width: 84px; height: 84px; padding: 0; border-radius: 50%; border: 2px dashed var(--line-strong); background: var(--surface-2); color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: border-color .15s, transform .15s; }
.ph-circle:hover { border-color: var(--accent); transform: scale(1.03); }
.ph-circle > b { font-size: 28px; color: hsl(var(--h) 85% 92%); }
.ph-circle:not(.has):has(> b) { border-style: solid; border-color: transparent; background: hsl(var(--h) 42% 34%); }
.ph-circle > img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.ph-circle.has { border: 2px solid var(--line-strong); }
.ph-cam { position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border: 3px solid var(--surface); }
.ph-t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ph-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* Кадрирование под круг */
.modal.crop-modal { width: min(360px, calc(100vw - 24px)); display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.crop-box { position: relative; align-self: center; overflow: hidden; border-radius: 16px; background: #000; cursor: grab; touch-action: none; user-select: none; }
.crop-box:active { cursor: grabbing; }
.crop-box img { position: absolute; left: 50%; top: 50%; max-width: none; pointer-events: none; }
.crop-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 400px rgba(0, 0, 0, 0.62); outline: 2px solid rgba(255, 255, 255, 0.85); pointer-events: none; }
.crop-zoom { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.crop-zoom input { flex: 1; accent-color: var(--accent); }
.crop-modal .c { text-align: center; margin: 0; }

.modal.me-modal { width: min(440px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 14px; }

/* Подсказка с реальным именем */
.real-tip { position: fixed; z-index: 200; left: 0; top: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; padding: 7px 12px; border-radius: 10px; background: var(--text); color: var(--bg); box-shadow: var(--shadow); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 260px; text-align: center; }
.real-tip.on { opacity: 1; transform: none; }
.real-tip small { font-size: 11px; opacity: .65; }
.real-tip b { font-size: 14px; }
.home-card .enter-row { grid-template-columns: 1fr; }
.home-card .code-row { display: flex; gap: 8px; }
.home-card .code-row .code-inp { flex: 1; min-width: 0; text-align: center; letter-spacing: .3em; text-transform: uppercase; }
.home-card .code-row .btn { flex: none; }


#demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.db-row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.db-l{font-size:12px;font-weight:800;color:var(--accent-text);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}

.db-p.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.db-p.add,.db-p.exit{background:transparent;border-style:dashed}
.db-hint{font-size:12px;color:var(--muted);margin-top:5px;min-height:15px}
.db-row .db-hint{margin:0}
